<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/motionkit.js"></script>
    <script src="lib/motion-blur.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fdfcfc;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fdfcfc;
      }
    </style>
  </head>
  <body>
    <!--
      Ask-it — explainer v4 (Endro), 60 fps, 98 s. 14 scenes mounted back to back at their voice cues.
      Every seam is a hard cut on the fastest frame: each scene ends with its own accelerating exit and the
      next one starts already moving (launched or oversized entry). No root transitions, no fades.
      Motion blur: lib/motion-blur.js attaches to every data-hf-motion-blur element of every scene.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="98"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="f01-hesitation"
        class="clip"
        data-composition-id="f01-hesitation"
        data-composition-src="compositions/f01-hesitation.html"
        data-start="0"
        data-duration="9.25"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f02-soixante-dix"
        class="clip"
        data-composition-id="f02-soixante-dix"
        data-composition-src="compositions/f02-soixante-dix.html"

        data-duration="3.75"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f03-probleme"
        class="clip"
        data-composition-id="f03-probleme"
        data-composition-src="compositions/f03-probleme.html"

      <!-- Voice-over + sound design + music, pre-mixed and mastered (-14 LUFS, -1 dBTP) by scripts/mix4.py -->

        id="soundtrack"
        src="assets/audio/mix_v4.wav"
        data-start="0"
        data-duration="98"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 98);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
