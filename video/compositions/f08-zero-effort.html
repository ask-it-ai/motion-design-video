      function caretOn(time, a, b, seq) {
        if (time < a || time >= b) return false;
        var s = at(seq, time);
        if (time - s.t < 0.22 && s.t > 0) return true;           // solid while keys are landing
        return Math.sin((time - a) * Math.PI * 2 / 0.6) > -0.2;  // deterministic blink
      }
      var drv = { t: 0 };
      tl.fromTo(drv, { t: 0 }, {
        t: D, duration: D, ease: "none",

          var t = drv.t;

      tl.fromTo(q("btn-send"), { boxShadow: SH_REST }, { boxShadow: SH_PRESS, duration: 0.12, ease: "power1.in" }, 2.6);

      tl.fromTo(q("btn-send"), { boxShadow: SH_PRESS }, { boxShadow: SH_REST, duration: 0.45, ease: "power2.out", immediateRender: false }, 2.74);
      // press triggers the swap → good-green « Demande envoyée ✓ »
      tl.to(q("btn-send"), { opacity: 0, duration: 0.12, ease: "power1.out" }, 2.76);
      tl.fromTo(q("btn-done"), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, 2.76);
      tl.fromTo(q("btncheck"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.28, ease: "power2.out" }, 2.9);
      // cursor leaves once the press has settled
      tl.to(q("cursor"), { x: 1190, y: 1200, duration: 0.45, ease: "power2.in" }, 3.18);

      /* ── Scene 3: team checklist — receipt card pops, rows tick (équipe 3.84 · reste 4.61) ── */
      tl.fromTo(q("panel"), { opacity: 0, y: 40, scale: 0.92, filter: "blur(10px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 3.46);
      ["av1", "av2", "av3"].forEach(function (k, i) {
        tl.fromTo(q(k), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 3.62 + i * 0.05);
      });
      tl.fromTo(q("st-run"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 3.62);
      // pulsing "working" dot — finite, killed at resolve
      var pulse = { p: 0 }, stdot = q("stdot");
      tl.fromTo(pulse, { p: 0 }, {
        p: Math.PI * 2 * 3, duration: 1.15, ease: "none",
        onUpdate: function () { stdot.style.opacity = String(0.55 + 0.45 * Math.cos(pulse.p)); }
      }, 3.62);
      var TICK0 = 4.0, GAP = 0.25;
      for (var i = 0; i < 4; i++) {
        var task = q("t" + i), sp = q("sp" + i), ck = q("ck" + i), cp = q("cp" + i), lab = q("tl" + i);
        var T = TICK0 + i * GAP;
        tl.fromTo(task, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 3.6 + i * 0.06);
        tl.fromTo(sp, { rotation: 0 }, { rotation: 560 * (T - 3.6), duration: T - 3.6, ease: "none" }, 3.6);
        tl.to(sp, { scale: 0.3, opacity: 0, duration: 0.12, ease: "power2.in" }, T);
        tl.fromTo(ck, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, T + 0.04);
        tl.fromTo(cp, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.24, ease: "power2.out" }, T + 0.1);
        tl.to(lab, { color: "#241F20", duration: 0.2, ease: "power1.out" }, T + 0.04);

      var drops = [["nA", 5.42, -1.6], ["nB", 5.72, 1.4], ["nC", 6.02, -1.2]];
      drops.forEach(function (d) {

      var __lead = gsap.timeline({ paused: true });
      __lead.add(tl.paused(false), 0.3);
      window.__timelines[ID] = __lead;
    })();
