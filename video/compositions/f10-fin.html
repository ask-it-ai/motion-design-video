    (function () {

      var tl = gsap.timeline({ paused: true });

      function flash(el, t, peak, attack, decay, ease) {

      /* ── GRID_100 (10×10, 26 px dots, pitch 44, centred 520,520); her dot = row 4 / col 5 ── */
      var HER = 34, HX = 498, HY = 454;
      var dotsHost = q("dots");
      var base = [], lit = [];
      for (var i = 0; i < 100; i++) {
        var r = Math.floor(i / 10), c = i % 10;

        b.className = P + "dot"; b.style.left = x + "px"; b.style.top = y + "px";
        dotsHost.appendChild(b); base.push(b);
        var l = document.createElement("div");
        l.className = P + "lit"; l.style.left = x + "px"; l.style.top = y + "px";
        dotsHost.appendChild(l); lit.push(l);
      }
      // index-derived order — the SAME 69 others (+ her) that faded away in frame 2, now lighting up in the same order
      var prand = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      var others = [];
      for (var k = 0; k < 100; k++) if (k !== HER) others.push({ i: k, key: prand(k * 7.13 + 3.7) });

      var stayers = others.slice(0, 69).map(function (o) { return o.i; });

      tl.fromTo(q("avcheck"), { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 0.32);
      tl.fromTo(q("avcheck"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.32);
      // ambient-glow-bloom behind her, landing as one beat with « restée »
      tl.fromTo(q("avglow"), { opacity: 0, scale: 0.8 }, { opacity: 0.3, scale: 1, duration: 0.9, ease: "power2.out" }, 0.95);
      tl.fromTo(q("avglow"), { opacity: 0.3 }, { opacity: 0.34, duration: 0.25, ease: "sine.inOut", immediateRender: false }, 1.85);
      tl.fromTo(q("avglow"), { opacity: 0.34, scale: 1 }, { opacity: 0, scale: 0.9, duration: 0.35, ease: "power2.in", immediateRender: false }, 2.1);
      tl.to(q("avcheck"), { opacity: 0, duration: 0.2, ease: "power1.in" }, 2.15);

      /* ── Scene 2 (2.15–4.6): camera pulls back, she becomes one dot of GRID_100; 70 light up coral ── */
      var PB = 2.15, PBD = 0.8, S0 = 4.0;   // avatar 100 px × 1.04 drift = 104 px = 26 px dot × 4.0
      tl.fromTo(q("cam"), { x: 960 - HX, y: 520 - HY, scale: S0 }, { x: 0, y: 0, scale: 1, duration: PBD, ease: "power3.inOut" }, PB);
      tl.fromTo(q("av"), { x: 0, y: 0, scale: 1 }, { x: HX - 960, y: HY - 520, scale: 1 / S0 / 1.04, duration: PBD, ease: "power3.inOut" }, PB);
      tl.fromTo(q("avcoral"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.in" }, PB + 0.3);
      // the 99 others fade in centre-outward as the camera pulls back (ink at 15 %)
      base.forEach(function (el, idx) {
        var r = Math.floor(idx / 10), c = idx % 10;

        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, PB + 0.08 + d * 0.5);

      // seamless swap: avatar overlay → her in-world dot (identical 26 px coral disc)
      tl.fromTo(q("her"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, PB + PBD);
      tl.to(q("av"), { opacity: 0, duration: 0.01, ease: "none" }, PB + PBD + 0.01);

      tl.fromTo(q("herhalo"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, PB + PBD);

        var t = L0 + n * step;

      tl.fromTo(q("wdrift"), { scale: 1 }, { scale: 1.025, duration: 5.12 - (PB + PBD), ease: "none" }, PB + PBD);

      var SL = 3.08;
      tl.fromTo(q("statnum"), { yPercent: -120, opacity: 0, filter: "blur(12px)" }, { yPercent: 5, opacity: 1, filter: "blur(0px)", duration: 0.07, ease: "power4.in" }, SL);
      tl.fromTo(q("statnum"), { yPercent: 5 }, { yPercent: 0, duration: 0.27, ease: "back.out(2)", immediateRender: false }, SL + 0.07);
      var imp = q("impact"), NS = "http://www.w3.org/2000/svg";
      for (var a = 0; a < 12; a++) {
        var ang = (a / 12) * Math.PI * 2 + 0.13;
        var line = document.createElementNS(NS, "line");
        line.setAttribute("x1", String(Math.cos(ang) * 300)); line.setAttribute("y1", String(Math.sin(ang) * 168));
        line.setAttribute("x2", String(Math.cos(ang) * 344)); line.setAttribute("y2", String(Math.sin(ang) * 196));

      tl.fromTo(q("wfade"), { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 0.95, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, 5.12);
      tl.fromTo(q("mark"), { scale: 0, rotation: -18 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(1.7)" }, 5.3);
      tl.fromTo(q("mark"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 5.3);
      gsap.utils.toArray("#" + P + "lockup ." + P + "ch").forEach(function (ch, n) {

      tl.fromTo(q("cta"), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, 5.94);
