  <script>
    (function () {
      var ID = "f12-zero-effort", DUR = 7.15;

      var MB = '{"shutterAngle":360,"samplesPerFrame":12}';
      var tl = gsap.timeline({ paused: true });
      var fr = function (t) { return Math.round(t * 60) / 60; };   // instant events sit on the 60 fps grid
      var T_CLICK = fr(3.47);                                        // 3.467, end of « formulaire »

      var stage = $("stage"), shake = $("shake"), tilt = $("tilt"), rig = $("rig"), drift = $("drift"), snap = $("snap"), dof = $("dof");

      var bfForm = MK.blurFilter(stage, ID + "-blur-form");
      var bfPanel = MK.blurFilter(stage, ID + "-blur-panel");
      var bfRig = MK.blurFilter(stage, ID + "-blur-rig");

      /* ---------- build-time content (synchronous, deterministic) ---------- */
      var CHECK = '<svg viewBox="0 0 24 24"><path d="M6.4 12.4l3.6 3.5 7.6-7.8" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      var TASKS = ["Catalogue importé", "Diagnostic construit", "Page de résultat générée", "Installé sur votre site"];
      var TICK = [3.94, 4.19, 4.45, 4.70].map(fr);
      var rows = TASKS.map(function (label, i) {
        var r = mk("div", ID + "-task"); r.style.top = (160 + i * 86) + "px";
        var fl = mk("div", ID + "-tflash"), sp = mk("div", ID + "-tspin"), ck = mk("div", ID + "-tchk"), lb = mk("div", ID + "-tlab", label);

      });
      // notifications: each card is a pair — an unmarked shadow box + the motion-blurred card (no box-shadow on blurred copies)
      var ORDERS = [{ amt: "72,50 €", top: 488, land: 5.55 }, { amt: "58,00 €", top: 368, land: 5.80 }, { amt: "91,30 €", top: 248, land: 6.05 }];
      var notes = ORDERS.map(function (o, i) {
        var sh = mk("div", ID + "-nbox " + ID + "-nsh"), card = mk("div", ID + "-nbox " + ID + "-notif");
        sh.style.top = card.style.top = o.top + "px";
        card.appendChild(mk("div", ID + "-nlogo"));
        card.appendChild(mk("div", ID + "-ntitle", "Nouvelle commande"));
        card.appendChild(mk("div", ID + "-ntime", "à l’instant"));
        card.appendChild(mk("div", ID + "-namt", o.amt));

      tl.fromTo(tilt, { rotationX: 1.8, rotationY: -2.4, transformPerspective: 2200 }, { rotationX: -1.2, rotationY: 2.8, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo($("mesh"), { x: -36, y: 18, scale: 1 }, { x: 36, y: -20, scale: 1.06, duration: DUR, ease: "none" }, 0);

      /* ---------- Scene 1 (0.00–0.95): ENTRY — « Le mieux ? » launched LEFT, brakes ---------- */

      gsap.set(text, { filter: bfText.ref }); bfText.node.setAttribute("stdDeviation", "16 0");   // frame 0 carries the launch blur
      // « Le » rises from frame 0 (voice 0.17) so the hero reads by 0.10 s; « mieux ? » builds letter by letter on its syllable
      MK.words(tl, $("line1"), [{ w: "Le", t: 0.10 }, { w: "mieux ?", t: 0.30, accent: true, letters: true }], { lead: 0.1 });
      // static twin of the built line: it carries the fly-up so its motion-blur copies show the finished words
      var twin = $("line1").cloneNode(true);
      twin.id = ID + "-line1twin";

      gsap.set($("l2b"), { autoAlpha: 0 });
      tl.set($("l2b"), { autoAlpha: 0 }, 0);
      tl.set($("l2b"), { autoAlpha: 1 }, 2.00);

      MK.exit(tl, text, 2.41, { dir: "up", dist: 1000, frames: 14, blur: bfText });

      tl.set([$("ring1"), $("c1")], { autoAlpha: 1 }, 2.76);
      MK.type(tl, $("v1"), "Endro", 2.80, { cps: 60 });
      tl.set([$("ring1"), $("c1")], { autoAlpha: 0 }, 2.90);
      tl.set([$("ring2"), $("c2")], { autoAlpha: 1 }, 2.90);
      MK.type(tl, $("v2"), "endro-cosmetiques.com", 2.92, { cps: 90 });
      tl.set([$("ring2"), $("c2")], { autoAlpha: 0 }, 3.18);
      MK.pop(tl, $("chip"), 3.20, { over: 0.22 });
      // the touch reaches « Envoyer → » already moving (3.25–3.40), presses, clicks at 3.47
      var BTN = { x: 310 + 900 - 56 - 116.5, y: 250 + 404 + 38 };
      [touch, touchsh].forEach(function (el) {
        tl.set(el, { autoAlpha: 1 }, 3.25);
        // reaches the button at 3.40, settles until the 3-frame press starts
        tl.fromTo(el, { x: BTN.x + 300, y: BTN.y + 480 }, { x: BTN.x + 5, y: BTN.y + 7, duration: 9 * F, ease: "power2.out", immediateRender: false }, 3.25);
        tl.to(el, { x: BTN.x, y: BTN.y, duration: (T_CLICK - 3 * F) - (3.25 + 9 * F), ease: "sine.inOut" }, 3.25 + 9 * F);
      });
      tl.to(touchsh, { scale: 0.82, duration: 3 * F, ease: "power2.in" }, T_CLICK - 3 * F);
      tl.to(touchsh, { scale: 1, duration: 8 * F, ease: "back.out(2)" }, T_CLICK);
      tl.set(snap, { transformOrigin: BTN.x + "px " + BTN.y + "px" }, 0);
      gsap.set(snap, { transformOrigin: BTN.x + "px " + BTN.y + "px" });
      MK.click(tl, { t: T_CLICK, x: BTN.x, y: BTN.y, layer: fx, component: $("btnwrap"), shakeEl: shake, touch: touch, rig: snap, snap: 0.15,
        dashLen: 40, dashW: 7, r0: 50, r1: 124 });
      // instant state: the button turns good-green « Demande envoyée ✓ »
      tl.set($("btnsend"), { autoAlpha: 0 }, T_CLICK);
      tl.set($("btndone"), { autoAlpha: 1 }, T_CLICK);
      tl.fromTo($("btndone"), { scale: 0.9 }, { scale: 1.06, duration: 4 * F, ease: "power2.out", immediateRender: false }, T_CLICK);
      tl.to($("btndone"), { scale: 1, duration: 14 * F, ease: "power2.inOut" }, T_CLICK + 4 * F);
      tl.to([touch, touchsh], { x: BTN.x + 210, y: BTN.y + 330, autoAlpha: 0, duration: 18 * F, ease: "power2.in" }, 3.66);

      /* ---------- Scene 4 (3.55–5.05): « et notre équipe s'occupe du reste » ---------- */
      MK.pan(tl, rig, 3.55, { x: -180, frames: 28 });
      MK.enter(tl, panel, 3.55, { dir: "left", dist: 700, frames: 30, blur: bfPanel });
      MK.each([$("av1"), $("av2"), $("av3")], fr(3.72), 1, function (el, t) { MK.pop(tl, el, t, { over: 0.22 }); });
      rows.forEach(function (r, i) {
        var T = TICK[i];
        tl.fromTo(r.spin, { rotation: 0 }, { rotation: 430 * (T - 3.55), duration: T - 3.55, ease: "none" }, 3.55);
        tl.set(r.spin, { autoAlpha: 0 }, T);
        MK.pop(tl, r.chk, T, { over: 0.22 });
        tl.set(r.lab, { color: "#241F20" }, T);
        tl.fromTo(r.flash, { autoAlpha: 0.9 }, { autoAlpha: 0, duration: 22 * F, ease: "power2.out", immediateRender: false }, T);
        tl.set(r.flash, { autoAlpha: 0 }, 0);
      });
      gsap.set(rows.map(function (r) { return r.flash; }), { autoAlpha: 0 });

      /* ---------- Scene 5 (5.10–6.85): « Et vous ? Vous profitez. » ---------- */
      // the form + checklist go out of focus before the first drop
      gsap.set(dof, { transformOrigin: "1127px 560px" });
      tl.fromTo(dof, { filter: "blur(0px)", scale: 1, autoAlpha: 1 }, { filter: "blur(8px)", scale: 0.94, autoAlpha: 0.82, duration: 27 * F, ease: "power2.out", immediateRender: false }, 5.10);
      // three orders drop from above with gravity and stack (each lands on the pile)
      notes.forEach(function (n, i) {
        var land = n.o.land, fall = 16 * F, d0 = -(n.o.top + 104 + 120);
        [n.sh, n.card].forEach(function (el) {
          tl.set(el, { autoAlpha: 1 }, land - fall);
          tl.fromTo(el, { y: d0 }, { y: 0, duration: fall, ease: "power2.in", immediateRender: false }, land - fall);
          tl.fromTo(el, { scaleY: 1, scaleX: 1 }, { scaleY: 0.9, scaleX: 1.035, duration: 2 * F, ease: "power2.out", immediateRender: false }, land);
          tl.to(el, { scaleY: 1, scaleX: 1, duration: 8 * F, ease: "power2.out" }, land + 3 * F);
        });
        MK.shake(tl, shake, land, { px: 5 });
      });

      /* ---------- Scene 6 (6.85–7.15): EXIT — everything accelerates UP, last frame = fastest ---------- */
      MK.exit(tl, rig, 6.85, { dir: "up", dist: 1400, frames: 18, blur: bfRig });
      // depth: the out-of-focus stage travels ~0.6x the foreground orders, so the fastest (last) frame still carries it
      tl.to(dof, { y: "+=480", duration: 18 * F, ease: "expo.in" }, 6.85);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
