  <script>
    (function () {
      var ID = "f08-recommandation", DUR = 6.80, MK = window.MK, F = MK.F;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var shake = $("shake"), rig = $("rig"), plane = $("plane"), planez = $("planez"), page = $("page"), scroll = $("scroll");
      var sideL = $("sideL"), sideR = $("sideR"), stat = $("stat");
      var tl = gsap.timeline({ paused: true });

      // initial states (immediate): the page lies on a plane tilted rotateX 58° / rotateZ −12° at ×1.3
      gsap.set(plane, { rotationX: 58, scale: 1.3, y: -1090 });
      gsap.set(planez, { rotation: -12 });
      gsap.set([sideL, sideR], { scale: 0.85 });
      gsap.set($("seal"), { rotation: -8 });

      // total counter: fixed-width digit slots (DM Sans digits are proportional)
      var tnum = $("tnum"), slots = [];
      ["d", "d", ",", "d", "d", "eur"].forEach(function (k) {
        var s = document.createElement("span");
        if (k === "d") { s.className = ID + "-sd"; slots.push(s); } else if (k === ",") { s.className = ID + "-ss"; s.textContent = ","; } else { s.textContent = "€"; s.style.marginLeft = "0.2em"; }
        tnum.appendChild(s);
      });
      var renderTotal = function (v) {
        var c = Math.round(v * 100), str = (c < 1000 ? " " : "") + String(Math.floor(c / 100)) + String(c % 100).padStart(2, "0");
        for (var i = 0; i < 4; i++) slots[i].textContent = str[i] === " " ? "" : str[i];
      };

      // ground + never frozen: drift for the whole scene; floating cards/badges drift ×1.4 (same seed, +40 %)
      tl.fromTo($("mesh"), { x: 0, y: 0, scale: 1 }, { x: -44, y: 22, scale: 1.06, duration: DUR, ease: "sine.inOut" }, 0);
      MK.drift(tl, $("drift"), 0, DUR, { seed: 83 });
      MK.drift(tl, $("float"), 0, DUR, { seed: 83, zoom: 0.024, float: 10.4, rot: 0.16 });

      // ---- Scene 1 (0.00–1.05): launched left on the tilted plane, flying over her routine ----
      var bfPlane = MK.blurFilter($("stage"), ID + "-blur1");
      gsap.set(plane, { filter: bfPlane.ref }); bfPlane.node.setAttribute("stdDeviation", "16 0");   // frame 0 is already smeared
      MK.enter(tl, plane, 0, { dir: "left", dist: 1000, frames: 38, blur: bfPlane });
      tl.fromTo(scroll, { y: -300 }, { y: -1700, duration: 1.05, ease: "power1.out" }, 0);
      MK.pop(tl, $("step"), 0.22);

      // ---- Scene 2 (1.05–2.05): the plane straightens while the page scrolls back to the top → CORAIL02 header at 1:1 (1.55) ----
      tl.to(plane, { rotationX: 0, scale: 1, y: 0, duration: 30 * F, ease: "power3.inOut" }, 1.05);
      tl.to(planez, { rotation: 0, duration: 30 * F, ease: "power3.inOut" }, 1.05);
      tl.to(scroll, { y: 0, duration: 30 * F, ease: "power3.inOut" }, 1.05);
      var bfScroll = MK.blurFilter($("stage"), ID + "-blur2");
      bfScroll.ramp(tl, page, 1.13, 10 * F, 0, 9, "y", "power2.in");
      bfScroll.ramp(tl, page, 1.13 + 10 * F, 12 * F, 9, 0, "y", "power2.out");
      bfScroll.clear(tl, page, 1.13 + 22 * F);
      MK.ring(tl, $("pfx"), 1.58, { x: 390, y: 510, r0: 160, r1: 290, color: "#F8571F", width: 6 });

      // ---- Scene 3 (2.03–2.90): « 100 % » — the page defocuses 5 frames before the slam, impact on 2.26 ----
      tl.fromTo(page, { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 8 * F, ease: "power2.out", immediateRender: false }, 2.03);
      MK.slam(tl, stat, 2.11, { shakeEl: shake });                              // impact 2.26

      // ---- Scene 4 (2.85–3.70): « personnalisée » — pull back, two other visitors' pages fan out ----
      MK.suck(tl, stat, 2.85);
      MK.snapZoom(tl, rig, 2.92, { from: 1, to: 0.7, origin: "1567px 540px" });
      tl.to(page, { filter: "blur(0px)", duration: 10 * F, ease: "power2.out" }, 2.95);
      tl.set(page, { filter: "none" }, 2.95 + 10 * F);
      [[sideL, -629, 18, 3.00], [sideR, 628, -18, 3.00 + 4 * F]].forEach(function (s) {
        tl.fromTo(s[0], { autoAlpha: 0 }, { autoAlpha: 1, duration: F, ease: "none" }, s[3]);
        tl.fromTo(s[0], { x: 0, rotationY: 0 }, { x: s[1], rotationY: s[2], duration: 22 * F, ease: "expo.out" }, s[3]);
      });

      // ---- Scene 5 (3.70–5.10): « sa routine sur mesure » — the routine bursts out as cards, the total counts ----
      MK.exit(tl, sideL, 3.70, { dir: "left", dist: 1300, frames: 14 });
      MK.exit(tl, sideR, 3.70, { dir: "right", dist: 1300, frames: 14 });
      tl.set([sideL, sideR], { autoAlpha: 0 }, 3.70 + 14 * F);                  // gone for good (the final suction must not pull them back in)
      MK.snapZoom(tl, rig, 3.75, { from: 0.7, to: 1, origin: "1567px 540px" });
      tl.to(scroll, { y: -1500, duration: 20 * F, ease: "power3.inOut" }, 3.80);
      tl.fromTo(page, { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 8 * F, ease: "power2.out", immediateRender: false }, 3.82);
      MK.anticipate(tl, page, 3.90, { to: 0.94 });
      tl.to(page, { scale: 1, duration: 16 * F, ease: "back.out(2.2)" }, 3.90);
      [["c1", -660, 180, -170, -10], ["c2", -924, 280, -190, -6], ["c3", -660, -24, -120, 8], ["c4", -924, 76, -140, 12]].forEach(function (c, i) {
        MK.fly(tl, $(c[0]), 3.90 + i * 4 * F, { dx: c[1], dy: c[2], arc: c[3], rotation: c[4], frames: 26 });
      });
      MK.pop(tl, $("total"), 4.30, { over: 0.16 });
      renderTotal(0);
      var fin = MK.count(tl, 4.40, { from: 0, to: 72.5, dur: 0.5, penultimate: 72.4, holdFrames: 10, render: renderTotal });   // final ≈ 5.07
      tl.to($("tnum"), { scale: 1.14, duration: 3 * F, ease: "power2.out" }, fin);
      tl.to($("tnum"), { scale: 1, duration: 14 * F, ease: "power2.inOut" }, fin + 3 * F);

      // ---- Scene 6 (5.20–6.50): « et les arguments qui la rassurent » — badges pop, then pulse together on « rassurent » ----
      MK.snapZoom(tl, rig, 5.20, { from: 1, to: 0.92, origin: "1040px 470px" });   // « et »: small pull-back, room for the badges (rig scale is exactly 1 here)
      var badges = [$("b1"), $("b2"), $("seal"), $("b4")];
      MK.each(badges, 5.46, 4, function (b, t) { MK.pop(tl, b, t); });
      tl.to(badges, { scale: 1.04, duration: 5 * F, ease: "power2.out" }, 6.12);
      tl.to(badges, { scale: 1, duration: 14 * F, ease: "power2.inOut" }, 6.12 + 5 * F);

      // ---- Scene 7 (6.50–6.80): SUCTION — the whole stage shrinks to 55 %, accelerating, and fades ----
      MK.suck(tl, rig, 6.50, { to: 0.55, frames: 18 });                        // converges on the cluster centre (1040, 470)
      MK.suck(tl, $("hud"), 6.50, { to: 0.55, frames: 18 });

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
