    (function () {
      var ID = "f01-hesitation";
      var DUR = 12.39;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var prand = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

      var phone = $("phone"), world = $("world"), burst = $("burst"), card = $("card"), scroller = $("scroller");
      var touch = $("touch"), tag = $("tag"), rippleA = $("rippleA"), rippleB = $("rippleB");
      var liftA = $("liftA"), liftB = $("liftB"), ringA = $("ringA"), ringB = $("ringB");
      var root = phone.closest('[data-composition-id="' + ID + '"]') || document;

      var tl = gsap.timeline({ paused: true });

      // ── geometry (phone-local px; screen inset 14, status bar 44, page scale 442/780) ──
      var S1 = 690;                       // scroll after Scene 2 → Bonne Mine / Anti-Taches row mid-screen
      var S2 = 970;                       // + 280 in Scene 4
      var TILE_Y = 14 + 44 + 1122.567 - S1; // tile centers (phone-local y) at S1 = 490.567
      var AX = 14 + 119.567, BX = 14 + 322.433;
      var TAG_X = 492;                    // tag hangs just outside the phone's right edge

      // ── initial states ──
      tl.set(touch, { x: 414, y: 714, scale: 0.6, opacity: 0 }, 0);
      tl.set(tag, { x: 478, y: 714, opacity: 0, filter: "blur(8px)" }, 0);
      tl.set([rippleA, rippleB], { scale: 0.6, opacity: 0 }, 0);
      tl.set(rippleA, { x: AX, y: TILE_Y }, 0);
      tl.set(rippleB, { x: BX, y: TILE_Y }, 0);
      tl.set([ringA, ringB], { opacity: 0, scale: 1.1 }, 0);
      tl.set([liftA, liftB], { scale: 1, x: 0 }, 0);
      tl.set(scroller, { y: 0 }, 0);
      tl.set(card, { scale: 1, y: 0 }, 0);
      tl.set(world, { scale: 1 }, 0);
      tl.set(burst, { scale: 1, opacity: 1, "--recede": "0px" }, 0);

      // ════ Scene 1 (0.0–1.4): PHONE_AVANT rises in, slow drift; touch + visitor-tag on « Hmm » ════
      tl.fromTo(phone, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
      tl.fromTo(phone, { y: 60, filter: "blur(12px)" }, { y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 0);
      tl.set(phone, { filter: "none" }, 0.92);
      tl.fromTo(phone, { scale: 0.9 }, { scale: 0.93, duration: DUR, ease: "none" }, 0);

      tl.to(touch, { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, 0.36);
      tl.to(tag, { x: TAG_X, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 0.46);
      tl.to(touch, { x: 410, y: 706, duration: 0.72, ease: "sine.inOut" }, 0.68);
      tl.to(tag, { y: 706, duration: 0.72, ease: "sine.inOut" }, 0.7);

      // ════ Scene 2 (1.4–3.1): thumb drags up, page scrolls 0 → S1 (power2.inOut) ════
      tl.to(scroller, { y: -S1, duration: 1.5, ease: "power2.inOut" }, 1.4);
      // drag = first half of the scroll, 1:1 with the page (power2.in == first half of power2.inOut)
      tl.to(touch, { y: 706 - S1 / 2, duration: 0.75, ease: "power2.in" }, 1.4);
      tl.to(tag, { y: 706 - S1 / 2, duration: 0.8, ease: "power2.in" }, 1.42);
      // release: the page coasts on, the thumb lifts off
      tl.to(touch, { x: 404, y: 336, duration: 0.43, ease: "power2.out" }, 2.15);
      tl.to(touch, { opacity: 0.8, scale: 1.06, duration: 0.2, ease: "power2.out" }, 2.15);
      tl.to(tag, { y: 336, duration: 0.38, ease: "power2.out" }, 2.22);
      // travel to Sérum Bonne Mine
      tl.to(touch, { x: AX, y: TILE_Y, duration: 0.28, ease: "power2.inOut" }, 2.6);
      tl.to(touch, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 2.6);
      tl.to(tag, { y: TILE_Y, duration: 0.33, ease: "power2.inOut" }, 2.62);

      var DOF = { 1: 3, 2: 7, 3: 11 };        // px — phone stays the only sharp plane
      var DIM = { 1: 1, 2: 0.85, 3: 0.66 };
      var packs = root.querySelectorAll(".f01-hesitation-pack");
      packs.forEach(function (el, i) {
        var dx = Number(el.dataset.dx), dy = Number(el.dataset.dy), size = Number(el.dataset.size);
        var depth = Number(el.dataset.depth), wave = Number(el.dataset.wave), order = Number(el.dataset.order);
        el.style.width = size + "px";
        el.style.height = size + "px";
        gsap.set(el, { xPercent: -50, yPercent: -50 }); // self-centering baked once; x/y are pure offsets
        var at = wave === 1 ? 7.8 + order * 0.06 : 8.95 + order * 0.05;
        var dur = wave === 1 ? 1.1 : 1.0;
        var START = 0.15;  // partially-spread start: still hidden behind the phone
        tl.fromTo(el,
          { x: dx * START, y: dy * START, scale: 0.55 },
          { x: dx, y: dy, scale: 1, duration: dur, ease: "power3.out" }, at);
        tl.fromTo(el, { opacity: 0 }, { opacity: DIM[depth], duration: 0.24, ease: "power1.out" }, at);
        // motion blur in flight → settles to its depth-of-field blur
        tl.fromTo(el, { "--dof": "10px" }, { "--dof": DOF[depth] + "px", duration: dur, ease: "power2.out" }, at);
        // slight wobble keeps them alive (finite sine segments, index-seeded)
        var inner = el.firstElementChild;
        wobble(inner, i, at + dur * 0.55, DUR);
      });

      // ════ Scene 6 (10.41–12.39): « Bon… je verrai plus tard » — packshots recede, tab closes ════
      tl.to(burst, { scale: 0.9, opacity: 0.35, "--recede": "3px", duration: 1.12, ease: "power2.inOut" }, 10.28);
      tl.to(burst, { scale: 0.885, duration: DUR - 11.4, ease: "sine.out" }, 11.4);
      // thumb goes to the bottom edge, then swipes the page card away
      tl.to(touch, { x: 235, y: 905, duration: 0.44, ease: "power2.inOut" }, 10.58);
      tl.to(tag, { y: 905, duration: 0.46, ease: "power2.inOut" }, 10.62);
      tl.to(card, { scale: 0.82, duration: 0.27, ease: "power2.out" }, 11.08);
      tl.to(touch, { y: 845, duration: 0.27, ease: "power2.out" }, 11.08);
      tl.to(tag, { y: 845, duration: 0.28, ease: "power2.out" }, 11.12);
      tl.to(card, { y: -1000, duration: 0.45, ease: "power3.in" }, 11.35);
      tl.set(card, { filter: "blur(0px)" }, 11.44);
      tl.to(card, { filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, 11.45);
      tl.to(touch, { y: 845 - 1000, duration: 0.45, ease: "power3.in" }, 11.35); // rides the card (same ease)
      tl.to(touch, { opacity: 0, scale: 1.15, duration: 0.2, ease: "power2.in" }, 11.52);
      tl.to(tag, { y: 820, duration: 0.55, ease: "power1.out" }, 11.42);
      tl.to(tag, { opacity: 0, x: TAG_X + 12, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, 11.6);

      // ── helpers ──
      function tapAt(t, lift, ring, ripple) {
        // touch + tile depress together (cursor compresses more than the target), then release
        tl.to(touch, { scale: 0.85, duration: 0.09, ease: "power2.in" }, t);
        tl.to(touch, { scale: 1, duration: 0.14, ease: "power2.out" }, t + 0.09);
        tl.to(lift, { scale: 0.95, duration: 0.09, ease: "power2.in" }, t);
        tl.to(lift, { scale: 1.03, duration: 0.3, ease: "back.out(1.6)" }, t + 0.09);
        // single ripple ring from the click point (rests at opacity 0 until the click; set + to stays seek-safe)
        tl.set(ripple, { scale: 0.6, opacity: 0.9 }, t + 0.02);
        tl.to(ripple, { scale: 2.3, opacity: 0, duration: 0.42, ease: "power2.out" }, t + 0.02);
        // 3px white highlight ring pops in (back.out)
        tl.to(ring, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.6)" }, t + 0.06);
      }
      function shake(el, t) {
        // x ±6 px, 3 cycles
        var seq = [6, -6, 6, -6, 6, -6, 0];
        for (var k = 0; k < seq.length; k++) {
          tl.to(el, { x: seq[k], duration: k === 0 || k === seq.length - 1 ? 0.04 : 0.05, ease: "sine.inOut" }, t + (k === 0 ? 0 : 0.04 + (k - 1) * 0.05));
        }
      }
      function wobble(el, i, start, end) {
        var ay = 5 + prand(i * 3.1 + 1) * 5;
        var ar = 1.1 + prand(i * 5.7 + 2) * 1.6;
        var sgn = prand(i * 9.1 + 4) < 0.5 ? 1 : -1;
        var spanY = end - start;
        var nY = Math.max(1, Math.round(spanY / (1.05 + prand(i * 2.3 + 3) * 0.5)));
        var nR = Math.max(1, Math.round(spanY / (1.35 + prand(i * 4.9 + 5) * 0.6)));
        var segY = spanY / nY, segR = spanY / nR, k;
        for (k = 0; k < nY; k++) tl.to(el, { y: (k % 2 === 0 ? 1 : -1) * sgn * ay, duration: segY, ease: "sine.inOut" }, start + k * segY);
        for (k = 0; k < nR; k++) tl.to(el, { rotation: (k % 2 === 0 ? -1 : 1) * sgn * ar, duration: segR, ease: "sine.inOut" }, start + k * segR);
      }

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
