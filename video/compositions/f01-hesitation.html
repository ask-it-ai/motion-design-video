  <script>
    (function () {
      var ID = "f01-hesitation";
      var DUR = 9.25;
      var MK = window.MK, F = MK.F, H = MK.hash;
      var MB = '{"shutterAngle":360,"samplesPerFrame":12}';
      var $ = function (s) { return document.getElementById(ID + "-" + s); };

      var stage = $("stage"), shake = $("shake"), rig = $("rig"), drift = $("drift"), tilt = $("tilt"), card = $("card"), page = $("page"), pagein = $("pagein"), dim = $("dim");
      var tileA = $("tile-a"), tileB = $("tile-b"), selA = $("sel-a"), selB = $("sel-b"), fx = $("fx"), touch = $("touch"), tag = $("tag"), bubble = $("bubble");
      var words = $("words"), line1 = $("line1"), line2 = $("line2");
      var depth = { near: $("depth-near"), mid: $("depth-mid"), far: $("depth-far") };

      var tl = gsap.timeline({ paused: true });
      var INK = "#F2EFEC", LIFT = "0 26px 48px -14px rgba(0,0,0,0.55)", NOLIFT = "0 0px 0px 0px rgba(0,0,0,0)", CARD_SH = "0 60px 110px -30px rgba(0,0,0,0.78)";

      // ── geometry (content px = frame px at rig scale 1) ──
      // screen top-left at (510, -296); the page scrolls by translating the 780-px screenshot (source px = screen px)
      var SCR = { x: 510, y: -296 }, C = { x: 900, y: 548 };   // screen top-left · phone centre
      var S0 = 300, S_OVER = 1510, S_REST = 1450;             // scroll (source px at the screen top)
      function tilePt(col, rowTop) { return { x: SCR.x + (col ? 398 : 40) + 171, y: SCR.y + rowTop + 171 - S_REST }; }
      var A = tilePt(0, 1810), B = tilePt(1, 1810);        // Sérum Bonne Mine · Sérum Anti-Taches (upper row)
      var A4 = tilePt(0, 2422), B4 = tilePt(1, 2422);      // lower row
      var Q = { x: 940, y: 545 };                 // where the whole phone sits on screen once zoomed out (rig 0.5)

      // ── camera (.rig) state, tracked so every transform-origin change is compensated (no jump) ──
      var cam = { x: 0, y: 0, s: 1, ox: 960, oy: 540 };
      gsap.set(rig, { transformOrigin: "960px 540px", x: 0, y: 0, scale: 1 });
      function setOrigin(t, ox, oy) {
        var nx = cam.x + (cam.ox - ox) * (1 - cam.s), ny = cam.y + (cam.oy - oy) * (1 - cam.s);
        tl.set(rig, { transformOrigin: ox + "px " + oy + "px", x: nx, y: ny }, t);
        cam.x = nx; cam.y = ny; cam.ox = ox; cam.oy = oy;
      }
      function onScreen(p) { return { x: cam.ox + (p.x - cam.ox) * cam.s + cam.x, y: cam.oy + (p.y - cam.oy) * cam.s + cam.y }; }

      // ── initial states (every later change is a tween or a timeline set) ──
      gsap.set(page, { y: -S0 });
      gsap.set(touch, { x: 1120, y: 900, scale: 1, autoAlpha: 1 });
      gsap.set([tag, bubble], { y: 640 });
      gsap.set(tilt, { transformOrigin: C.x + "px " + C.y + "px", transformPerspective: 2000, rotationY: -3, rotationX: 2 });
      gsap.set([words, selA, selB], { autoAlpha: 0 });
      gsap.set([tileA, tileB], { transformOrigin: "50% 50%", y: 0 });

      var pageBlur = MK.blurFilter(stage, ID + "-blur-page"), rigBlur = MK.blurFilter(stage, ID + "-blur-rig");
      gsap.set(card, { filter: pageBlur.ref }); pageBlur.node.setAttribute("stdDeviation", "0 16");

      // ── never frozen: drift for the whole scene (+ the same drift, scaled, on the swarm depths = parallax) ──
      MK.drift(tl, drift, 0, DUR, { seed: 11 });
      MK.drift(tl, depth.near, 0, DUR, { seed: 11, float: 18, zoom: 0.042, rot: 0.28 });
      MK.drift(tl, depth.mid, 0, DUR, { seed: 11, float: 13, zoom: 0.03, rot: 0.2 });
      MK.drift(tl, depth.far, 0, DUR, { seed: 11, float: 7.8, zoom: 0.018, rot: 0.12 });
      // slight 3D attitude of the filmed plane
      tl.to(tilt, { rotationY: 4, rotationX: -1.5, duration: 5.42, ease: "sine.inOut" }, 0);
      tl.to(tilt, { rotationY: -2, rotationX: 1, duration: DUR - 5.42, ease: "sine.inOut" }, 5.42);

      function leg(t, x, y, d) { tl.to(touch, { x: x, y: y, duration: d || 0.35, ease: "power2.inOut" }, t); }
      function follow(t, y, d) { tl.to([tag, bubble], { y: y, duration: d || 0.4, ease: "power2.inOut" }, t); }
      function ripple(t, p) { MK.ring(tl, fx, t, { x: p.x, y: p.y, r0: 27, r1: 62, color: "rgba(255,255,255,0.95)", alpha: 0.5, width: 2.5, frames: 20 }); }

      // ════ Scene 1 (0.00–1.20) ENTRY: the page is already flung ════
      tl.fromTo(page, { y: -S0 }, { y: -S_OVER, duration: 1.0, ease: "expo.out", immediateRender: false }, 0);
      tl.fromTo(pagein, { y: 0 }, { y: S_OVER - S_REST, duration: 0.5, ease: "sine.inOut", immediateRender: false }, 0.45); // « Hmm »: settles back 60 px
      pageBlur.ramp(tl, card, 0, 10 * F, 16, 0, "y", "power2.out");
      pageBlur.clear(tl, card, 10 * F);
      tl.to(touch, { y: 640, duration: 8 * F, ease: "power2.out" }, 0);                // the thumb finishes the flick
      tl.to(touch, { autoAlpha: 0.5, duration: 12 * F, ease: "power1.out" }, 9 * F);
      MK.pop(tl, tag, 0.25);
      tl.to(touch, { x: 1100, y: 690, duration: 0.6, ease: "sine.inOut" }, 0.5);
      follow(0.5 + 3 * F, 690, 0.62);

      // ════ Scene 2 (1.20–2.90) « c'est lequel pour ma peau ? » ════
      MK.pan(tl, rig, 1.20, { x: -120, frames: 72, ease: "sine.inOut" }); cam.x = -120;
      leg(1.30, B4.x, B4.y + 14);
      follow(1.30 + 3 * F, B4.y + 14, 0.4);
      leg(1.90, A4.x, A4.y + 14);
      MK.pop(tl, bubble, 2.18, { over: 0.25 });
      leg(2.50, A.x, A.y);
      tl.to(touch, { autoAlpha: 1, duration: 0.2, ease: "power1.out" }, 2.50);
      follow(2.50 + 3 * F, A.y, 0.4);

      // ════ Scene 3 (2.98–4.40) « Celui-là ? » — « Ah non. » ════
      setOrigin(2.98 - 2 * F, A.x, A.y);
      MK.click(tl, { t: 2.98, x: A.x, y: A.y, layer: fx, component: tileA, shakeEl: shake, touch: touch, rig: rig, snap: 0.18, rigScale: cam.s, color: INK, dashLen: 40, dashW: 7, r0: 38, r1: 104 });
      cam.s *= 1.18;
      tl.set(selA, { autoAlpha: 1 }, 2.98); tl.set(tileA, { y: -8, boxShadow: LIFT }, 2.98); ripple(2.98, A);
      tl.to(rig, { scale: cam.s * 1.02, duration: 0.65, ease: "sine.inOut" }, 3.20); cam.s *= 1.02; // the camera leans in on the choice
      tl.to(touch, { x: A.x + 8, y: A.y + 12, duration: 0.35, ease: "sine.inOut" }, 3.40);
      tl.to(bubble, { scale: 1.18, duration: 5 * F, ease: "power2.out" }, 3.48);        // the doubt
      tl.to(bubble, { scale: 1, duration: 14 * F, ease: "power2.inOut" }, 3.48 + 5 * F);
      [-10, 8, -6, 4, -2, 0].forEach(function (v, i) {
        tl.to(selA, { x: v, duration: 3 * F, ease: "sine.inOut" }, 3.85 + i * 3 * F);
      });
      tl.to(selA, { opacity: 0.4, duration: 15 * F, ease: "power1.in" }, 3.85);
      tl.to(touch, { y: A.y - 14, autoAlpha: 0.7, duration: 12 * F, ease: "sine.out" }, 3.88);
      tl.set(selA, { autoAlpha: 0 }, 4.11);
      tl.to(tileA, { y: 0, boxShadow: NOLIFT, duration: 8 * F, ease: "power2.inOut" }, 4.11);
      // whip to the neighbour tile
      MK.pan(tl, rig, 4.10, { x: cam.x - 390, frames: 14, blur: rigBlur, blurMax: 10, axis: "x" }); cam.x -= 390;
      tl.to(touch, { x: B.x, y: B.y, autoAlpha: 1, duration: 0.30, ease: "power2.inOut" }, 4.12);

      // ════ Scene 4 (4.63–5.40) « Celui-là. » ════
      setOrigin(4.63 - 2 * F, B.x, B.y);
      MK.click(tl, { t: 4.63, x: B.x, y: B.y, layer: fx, component: tileB, shakeEl: shake, touch: touch, rig: rig, snap: 0.10, rigScale: cam.s, color: INK, dashLen: 40, dashW: 7, r0: 38, r1: 104 });
      cam.s *= 1.10;
      tl.set(selB, { autoAlpha: 1 }, 4.63); tl.set(tileB, { y: -8, boxShadow: LIFT }, 4.63); ripple(4.63, B);
      tl.to(rig, { scale: cam.s * 1.015, duration: 0.55, ease: "sine.inOut" }, 4.85); cam.s *= 1.015;
      tl.to(touch, { x: B.x + 70, y: B.y + 70, autoAlpha: 0.5, duration: 0.30, ease: "power2.inOut" }, 5.05);
      follow(5.08, B.y + 70, 0.32);

      // ════ Scene 5 (5.42–7.70) « Oh là là… y a vraiment trop de choix. » ════
      // origin chosen so that the pure snap-zoom to 0.5 lands the whole phone centred at Q
      var s0 = cam.s, s1 = 0.5, Ox = (Q.x - s1 * C.x - cam.x - cam.ox * (1 - s0)) / (s0 - s1), Oy = (Q.y - s1 * C.y - cam.y - cam.oy * (1 - s0)) / (s0 - s1);
      setOrigin(5.42 - F, Ox, Oy);
      MK.snapZoom(tl, rig, 5.42, { from: s0, to: s1, blurEl: rig }); cam.s = s1;       // 65 % jump lands at 5.57
      tl.to(touch, { autoAlpha: 0, duration: 8 * F, ease: "power1.in" }, 5.45);
      tl.set(selB, { autoAlpha: 0 }, 5.57); tl.set(tileB, { y: 0, boxShadow: NOLIFT }, 5.57);
      tl.to(rig, { scale: 0.52, duration: 7.92 - 5.84, ease: "sine.inOut" }, 5.84); cam.s = 0.52; // slow push while she drowns
      var Qs = onScreen(C);                                                             // phone centre after the push

      // the swarm: 12 packshots burst from behind the phone, then +4 / +4 / +6 on the words
      var IMGS = ["serum-bonne-mine", "serum-hydratant", "creme-bonne-mine", "gelee-nettoyante", "huile-seche", "masque-creme",
        "huile-lactee", "lait-corps", "gommage-visage-eclat", "deo-baume-monoi", "shampoing-normaux"];
      var DEPTH = { near: 1.25, mid: 1, far: 0.7 };
      var items = [ // initial 12 (screen px, mid-ring size, depth, rotation)
        { x: 470, y: 285, s: 230, d: "mid", r: -7 }, { x: 1440, y: 232, s: 215, d: "mid", r: 6 }, { x: 110, y: 150, s: 232, d: "near", r: -10 },
