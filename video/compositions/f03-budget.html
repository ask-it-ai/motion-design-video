<template id="f03-budget-template">
  <style>

  <div id="root" data-composition-id="f03-budget" data-start="0" data-duration="6.85" data-width="1920" data-height="1080">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "f03-budget";
      var DUR = 6.85;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var prand = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      var tl = gsap.timeline({ paused: true });

      var world = $("world"), dim = $("dim"), grid = $("grid");
      var spend = $("spend"), profile = $("profile"), setCard = $("settings-card");
      var counter = $("counter"), cwrap = $("counter-wrap"), title = $("title");
      var glow = $("glow"), heat = $("heat"), edge = $("edge"), field = $("embers");
      var S = [$("s0"), $("s1"), $("s2"), $("s3"), $("s4")];
      var rootEl = world.closest('[data-composition-id="' + ID + '"]') || document;

      // ── camera (origin 0,0): open close on the spend card, pull back for the profile, drift, blind push-in ──
      tl.fromTo(world, { x: 177, y: -76, scale: 1.3 }, { x: 156.6, y: -92.8, scale: 1.34, duration: 2.45, ease: "none" }, 0);
      tl.to(world, { x: 0, y: 0, scale: 1, duration: 0.7, ease: "power2.inOut" }, 2.45);
      tl.set(world, { filter: "blur(0px)" }, 2.44);
      tl.to(world, { filter: "blur(3px)", duration: 0.35, ease: "power2.in" }, 2.45);   // motion blur at peak speed
      tl.to(world, { filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, 2.8);
      tl.set(world, { filter: "none" }, 3.16);
      tl.to(world, { x: -11.52, y: -6.48, scale: 1.012, duration: 2.45, ease: "none" }, 3.15);  // slow drift about frame center

      // ════ Scene 1 (0.0–1.6): spend card establishes; counter at 8 240 € ════
      tl.fromTo(spend, { opacity: 0, y: 50, scale: 0.92, "--dof": "10px" }, { opacity: 1, y: 0, scale: 1, "--dof": "0px", duration: 0.45, ease: "expo.out" }, 0.05);
      tl.fromTo(title, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.22);
      tl.fromTo(cwrap, { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, 0.42);

      // ════ Scene 2 (1.67–3.2): « vous brûlez votre budget » — counter rolls 8 240 → 24 960 €, edge glows, embers rise ════
      var COUNT_AT = 1.44, COUNT_DUR = 0.86;
      var c = { v: 8240 }, five = false;
      tl.fromTo(c, { v: 8240 }, {
        v: 24960, duration: COUNT_DUR, ease: "power2.out",
        onUpdate: function () {
          var n = Math.round(c.v), str = String(n), isFive = n >= 10000;
          if (isFive !== five) { S[0].style.display = isFive ? "" : "none"; five = isFive; }
          if (isFive) { S[0].textContent = str[0]; S[1].textContent = str[1]; S[2].textContent = str[2]; S[3].textContent = str[3]; S[4].textContent = str[4]; }
          else { S[1].textContent = str[0]; S[2].textContent = str[1]; S[3].textContent = str[2]; S[4].textContent = str[3]; }
        }
      }, COUNT_AT);
      tl.fromTo(counter, { scale: 120 / 132 }, { scale: 1, duration: COUNT_DUR, ease: "power2.out" }, COUNT_AT); // digits grow as they climb
      // the card's bottom edge ignites (the only warm color in AVANT), then smoulders
      tl.fromTo([edge, heat], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.52);
      tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.55);
      var flick = [0.78, 1, 0.84, 1, 0.8, 1, 0.88];
      for (var f = 0; f < flick.length; f++) tl.to(glow, { opacity: flick[f], duration: 0.5, ease: "sine.inOut" }, 2.0 + f * 0.5);
      // ember particles — pure function of the driver (index-seeded births, buoyant rise, sway, fade)
      var N = 26, G = -40, FLIGHT = 1.85, parts = [];
      for (var i = 0; i < N; i++) {
        var el = document.createElement("div");
        el.className = "f03-budget-ember";
        var size = 4 + prand(i * 3 + 1) * 5;
        el.style.width = size + "px";
        el.style.height = size + "px";
        field.appendChild(el);
        parts.push({
          el: el,
          ox: 26 + prand(i * 5 + 2) * 568,
          vx: (prand(i * 11 + 4) - 0.5) * 50,
          vy: -(140 + prand(i * 7 + 3) * 150),
          sway: 5 + prand(i * 13 + 5) * 10,
          freq: 3 + prand(i * 17 + 6) * 4,
          phase: prand(i * 19 + 7) * 6.283,
          birth: prand(i * 23 + 8) * 0.55,
          life: 0.8 + prand(i * 29 + 9) * 0.38
        });
      }
      var drive = { T: 0 };
      tl.fromTo(drive, { T: 0 }, {
        T: 1, duration: FLIGHT, ease: "none",
        onUpdate: function () {
          var t = drive.T * FLIGHT;
          for (var j = 0; j < parts.length; j++) {
            var p = parts[j], a = t - p.birth;
            if (drive.T === 0 || a <= 0 || a >= p.life) { p.el.style.opacity = "0"; continue; }
            var k = a / p.life;
            var x = p.ox + p.vx * a + p.sway * Math.sin(p.freq * a + p.phase);
            var y = p.vy * a + 0.5 * G * a * a;
            var o = 0.6 * Math.min(1, a / 0.12) * Math.min(1, (1 - k) / 0.45);
            p.el.style.opacity = o.toFixed(3);
            p.el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) scale(" + (1 - 0.55 * k).toFixed(3) + ")";
          }
        }
      }, 1.58);

      // ════ Scene 3 (2.88–4.3): « des visiteurs dont vous ne savez rien » — profile card slides in, « ? » pills pop ════
      tl.fromTo(profile, { opacity: 0, x: 90, "--dof": "10px" }, { opacity: 1, x: 0, "--dof": "0px", duration: 0.45, ease: "expo.out" }, 2.62);
      var rows = rootEl.querySelectorAll(".f03-budget-row-label");
      rows.forEach(function (r, j) {
        tl.fromTo(r, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 2.7 + j * 0.04);
      });
      var qs = rootEl.querySelectorAll(".f03-budget-q");
      [2.88, 3.3, 3.7, 4.1].forEach(function (cue, j) {
        tl.fromTo(qs[j], { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.6)" }, cue - 0.14);
      });
      // focus racks from the burning counter to the unknown visitor
      tl.to(spend, { "--dof": "5px", opacity: 0.72, duration: 0.6, ease: "power2.inOut" }, 3.0);

      // ════ Scene 4 (4.9–6.85): « et vous optimisez… à l'aveugle » — settings card rises; the whole stage goes blind ════
      tl.fromTo(setCard, { rotationX: 35, yPercent: 60, opacity: 0, filter: "blur(10px)" }, { rotationX: 10, yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 4.62);
      tl.to(setCard, { rotationX: 6, duration: 0.5, ease: "sine.out" }, 5.07);
      tl.to(profile, { "--dof": "6px", opacity: 0.7, duration: 0.5, ease: "power2.inOut" }, 4.72);
      tl.to(spend, { "--dof": "7px", opacity: 0.62, duration: 0.5, ease: "power2.inOut" }, 4.72);
      // blind optimizing: knobs keep moving, toggles flip — before and after the stage defocuses
      var sliders = rootEl.querySelectorAll(".f03-budget-slider");
      var STOPS = [[0.35, 0.74, 0.5], [0.62, 0.4, 0.68], [0.48, 0.82, 0.6]];
      sliders.forEach(function (sl, j) {
        var knob = sl.querySelector(".f03-budget-knob"), fill = sl.querySelector(".f03-budget-fill"), W = 378;
        gsap.set(knob, { x: STOPS[j][0] * W });
        gsap.set(fill, { scaleX: STOPS[j][0] });
        tl.to(knob, { x: STOPS[j][1] * W, duration: 0.55, ease: "power2.inOut" }, 5.02 + j * 0.09);
        tl.to(fill, { scaleX: STOPS[j][1], duration: 0.55, ease: "power2.inOut" }, 5.02 + j * 0.09);
        tl.to(knob, { x: STOPS[j][2] * W, duration: 0.6, ease: "power2.inOut" }, 5.95 + j * 0.12);
        tl.to(fill, { scaleX: STOPS[j][2], duration: 0.6, ease: "power2.inOut" }, 5.95 + j * 0.12);
      });
      var t1 = $("t1"), t2 = $("t2");
      gsap.set(t1, { backgroundColor: "#8C8580" });
      gsap.set(t1.firstElementChild, { x: 26 });
      tl.to(t1.firstElementChild, { x: 0, duration: 0.22, ease: "power2.inOut" }, 5.3);
      tl.to(t1, { backgroundColor: "rgba(255,255,255,0.10)", duration: 0.22, ease: "power2.inOut" }, 5.3);
