      font: 700 300px/1 'DM Sans', sans-serif; letter-spacing: -0.05em; color: #241F20; white-space: nowrap; }
    #f09-chiffres-pct { display: inline-block; margin-left: 0.07em; transform-origin: 50% 70%; }
    #f09-chiffres-l4 { position: absolute; left: 860px; top: 690px; width: 800px; height: 80px; display: flex; align-items: center; justify-content: center; gap: 20px; }
    #f09-chiffres-l4w { font: 700 64px/1.1 'Lufga', sans-serif; letter-spacing: -0.02em; color: #241F20; white-space: nowrap; }

    #f09-chiffres-arrow svg { display: block; width: 58px; height: 74px; }
  </style>
  <div id="root" data-composition-id="f09-chiffres" data-fps="60" data-start="0" data-duration="5.25" data-width="1920" data-height="1080">
    <div id="f09-chiffres-bg" class="clip" data-start="0" data-duration="5.25" data-track-index="0" data-layout-allow-overflow>
      <div id="f09-chiffres-mesh"></div>
      <div id="f09-chiffres-grid"></div>
    </div>
    <div id="f09-chiffres-stage" class="clip" data-start="0" data-duration="5.25" data-track-index="1" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion>
      <div id="f09-chiffres-shake">
        <div id="f09-chiffres-rig">
          <div id="f09-chiffres-drift">
            <!-- « À la clé : » -->
            <div id="f09-chiffres-badge" data-hf-motion-blur='{"shutterAngle":360,"samplesPerFrame":12}'>
              <div id="f09-chiffres-keyw"><svg viewBox="0 0 56 56"><g id="f09-chiffres-key" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="28" r="8.5"/><path d="M25.5 28H46M39.5 28v7.5M45.5 28v5.5"/></g></svg></div>

              <div id="f09-chiffres-l1"></div>

                <div id="f09-chiffres-base"></div>

            <!-- the basket fills -->
            <div id="f09-chiffres-cartzone">
              <div id="f09-chiffres-pk1" class="f09-chiffres-pk" data-hf-motion-blur='{"shutterAngle":360,"samplesPerFrame":12}'><img src="assets/endro/products/serum-bonne-mine.jpg" alt=""></div>
              <div id="f09-chiffres-pk2" class="f09-chiffres-pk" data-hf-motion-blur='{"shutterAngle":360,"samplesPerFrame":12}'><img src="assets/endro/products/gelee-nettoyante.jpg" alt=""></div>
              <div id="f09-chiffres-pk3" class="f09-chiffres-pk" data-hf-motion-blur='{"shutterAngle":360,"samplesPerFrame":12}'><img src="assets/endro/products/creme-bonne-mine.jpg" alt=""></div>
              <div id="f09-chiffres-cart" data-hf-motion-blur='{"shutterAngle":360,"samplesPerFrame":12}'><svg viewBox="0 0 240 200">
                <path d="M49 56H226L206 140H68Z" fill="#FFFFFF"/>
                <path d="M57 84H218M63 112H212" stroke="rgba(36,31,32,0.16)" stroke-width="5" stroke-linecap="round"/>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="lib/motionkit.js"></script>
  <script>
    (function () {
      var ID = "f09-chiffres", DUR = 5.25;
      var MK = window.MK, F = MK.F;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var tl = gsap.timeline({ paused: true });
      var shake = $("shake"), rig = $("rig");
      gsap.set(rig, { transformOrigin: "960px 540px" });

      // background mesh drifts slowly (grid-bg)
      tl.fromTo($("mesh"), { x: 0, y: 0, scale: 1 }, { x: 40, y: -18, scale: 1.06, duration: DUR, ease: "sine.inOut" }, 0);

      // ---- Scene 1 (0.00–0.57): oversized entry braking + « À la clé : » ----
      MK.enterBig(tl, rig, 0, { from: 1.4, frames: 40 });
      MK.pop(tl, $("badge"), 0, { over: 0.25, inner: $("keyw") });
      MK.words(tl, $("hwords"), [{ w: "À", t: 0.15 }, { w: "la", t: 0.23 }, { w: "clé :", t: 0.36 }], { lead: 0.15 });
      // the key turns in the lock on « clé »
      tl.to($("key"), { rotation: -28, svgOrigin: "28 28", duration: 6 * F, ease: "power2.out" }, 0.36);
      tl.to($("key"), { rotation: 0, svgOrigin: "28 28", duration: 16 * F, ease: "back.out(2.2)" }, 0.36 + 6 * F);

      // ---- Scene 2 (0.57–2.80): « ×4 » slams, kinetic words, 1-vs-4 bars ----
      MK.slam(tl, $("x4"), 0.57, { shakeEl: shake }); // impact 0.72 on « quatre »
      [["l1", 1.20], ["l2", 1.64], ["l3", 2.07]].forEach(function (p) {
        tl.fromTo($(p[0]), { autoAlpha: 0 }, { autoAlpha: 1, duration: F, ease: "none" }, p[1]);
      });
      MK.words(tl, $("l1"), [{ w: "plus", t: 1.30 }, { w: "de", t: 1.51 }]);
      MK.words(tl, $("l2"), [{ w: "conversions", t: 1.64, accent: true, letters: true }]);
      MK.words(tl, $("l3"), [{ w: "en", t: 2.17 }, { w: "moyenne", t: 2.29 }]);
      tl.fromTo($("base"), { scaleX: 0 }, { scaleX: 1, duration: 16 * F, ease: "power2.out" }, 1.22);
      tl.fromTo($("bar0"), { scaleY: 0 }, { scaleY: 1, duration: 10 * F, ease: "power2.out" }, 1.34);
      tl.fromTo($("lab0"), { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 16 * F, ease: "power2.out" }, 1.30);
      tl.fromTo($("bar1"), { scaleY: 0 }, { scaleY: 1.08, duration: 16 * F, ease: "power3.out" }, 1.64);
      tl.to($("bar1"), { scaleY: 1, duration: 12 * F, ease: "power2.inOut" }, 1.64 + 16 * F);
      tl.fromTo($("lab1"), { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 16 * F, ease: "power2.out" }, 1.62);
      // « moyenne »: the ×4 breathes once so the hero never sits dead
      tl.to($("x4"), { scale: 1.035, duration: 8 * F, ease: "sine.out" }, 2.29);
      tl.to($("x4"), { scale: 1, duration: 18 * F, ease: "sine.inOut" }, 2.29 + 8 * F);

      // ---- Scene 3 (2.91–3.55): suction, the cart pops, packshots drop in with gravity ----
      MK.suck(tl, $("x4grp"), 2.95);
      MK.pop(tl, $("cart"), 3.13);
      // local helper (MK.toss always rises first): pure gravity drop from 500 px above, lagging tilt, squash on landing
      function drop(el, t, rot, dx) {
        var n = 16, land = t + n * F;
        tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: F, ease: "none" }, t);
        tl.fromTo(el, { y: -500, x: dx, rotation: rot + (rot < 0 ? -24 : 24) }, { y: 0, x: 0, rotation: rot, duration: n * F, ease: "power2.in" }, t);
        tl.to(el, { scaleX: 1.16, scaleY: 0.78, duration: 3 * F, ease: "power2.out" }, land);
        tl.to(el, { scaleX: 1, scaleY: 1, duration: 14 * F, ease: "back.out(2.4)" }, land + 3 * F);
        return land;
      }
      var land1 = drop($("pk1"), 3.14, -9, -40);
      drop($("pk2"), 3.14 + F, 7, 36);
      drop($("pk3"), 3.14 + 2 * F, -2, 10);
      // the cart takes the weight
      tl.to($("cartzone"), { y: 9, duration: 3 * F, ease: "power2.out" }, land1);
      tl.to($("cartzone"), { y: 0, duration: 16 * F, ease: "back.out(2)" }, land1 + 3 * F);

      // ---- Scene 4 (3.46–4.95): « +36 % » slams, « plus élevés », arrow, cart squash ----
      MK.slam(tl, $("p36"), 3.46, { shakeEl: shake }); // impact 3.61 on « trente-six »
      tl.to($("pct"), { scale: 1.16, rotation: -6, duration: 5 * F, ease: "power2.out" }, 4.02);
      tl.to($("pct"), { scale: 1, rotation: 0, duration: 16 * F, ease: "back.out(2)" }, 4.02 + 5 * F);
      MK.words(tl, $("l4w"), [{ w: "plus", t: 4.36, accent: true, letters: true }, { w: "élevés", t: 4.57, accent: true, letters: true }]);
      tl.fromTo($("arrow"), { scaleY: 0, autoAlpha: 0 }, { scaleY: 1.18, autoAlpha: 1, duration: 8 * F, ease: "power3.out" }, 4.57);
      tl.to($("arrow"), { scaleY: 1, duration: 16 * F, ease: "power2.inOut" }, 4.57 + 8 * F);
      tl.to($("cartzone"), { scaleY: 0.9, scaleX: 1.04, duration: 4 * F, ease: "power2.in" }, 4.57);
      tl.to($("cartzone"), { scaleY: 1, scaleX: 1, duration: 18 * F, ease: "back.out(2.6)" }, 4.57 + 4 * F);

      // ---- Scene 5 (4.95–5.25): push left, the last frame is the fastest ----
      var blur = MK.blurFilter(root, ID + "-blur1");
      MK.exit(tl, rig, 4.95, { dir: "left", dist: 1600, frames: 18, blur: blur });

      // camera life for the whole scene
      MK.drift(tl, $("drift"), 0, DUR, { seed: 9 });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
