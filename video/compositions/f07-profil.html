                <path id="f07-profil-linkB" d="M 1200 800 C 1200 832, 1130 824, 1130 856" fill="none" stroke="#E8A23B" stroke-width="3.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="lib/motionkit.js"></script>
  <script>
    (function () {
      var ID = "f07-profil", DUR = 4.70, MK = window.MK, F = MK.F;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var shake = $("shake"), rig = $("rig"), timer = $("timer"), card = $("card");
      var tl = gsap.timeline({ paused: true });
      gsap.set([$("dotA"), $("dotB")], { transformOrigin: "50% 50%" });

      // ground: the brand mesh drifts slowly for the whole scene
      tl.fromTo($("mesh"), { x: 0, y: 0, scale: 1 }, { x: 40, y: -26, scale: 1.06, duration: DUR, ease: "sine.inOut" }, 0);

      // never frozen: drift on .drift for the whole scene + a slow 3D attitude of the camera
      MK.drift(tl, $("drift"), 0, DUR, { seed: 71 });
      tl.fromTo($("att"), { rotationY: -3, rotationX: 2 }, { rotationY: 4, rotationX: -1.5, duration: DUR, ease: "sine.inOut" }, 0);

      // ---- Scene 1 (0.00–1.00): launched entry of the timer, « 30 s » slams on « trente », the ring runs ----
      var bfIn = MK.blurFilter($("stage"), ID + "-blur1");
      gsap.set(timer, { filter: bfIn.ref }); bfIn.node.setAttribute("stdDeviation", "16 0");   // frame 0 is already smeared (a set at exactly 0 does not render)
      MK.enter(tl, timer, 0, { dir: "left", dist: 1100, frames: 30, blur: bfIn });
      var impact = MK.slam(tl, $("ttext"), 0.07, { shakeEl: shake });          // impact 0.22
      tl.to($("arc"), { strokeDashoffset: 0, duration: 0.88 - impact, ease: "power1.inOut" }, impact);
      tl.fromTo($("knobrot"), { rotation: 0 }, { rotation: 360, duration: 0.88 - impact, ease: "power1.inOut" }, impact);
      tl.fromTo($("knob"), { scale: 0.4 }, { scale: 1, duration: 8 * F, ease: "back.out(3)" }, impact);
      // lock 10 frames (0.88–1.05) — drift only

      // ---- Scene 2 (1.00–2.10): « vous savez qui elle est » ----
      MK.suck(tl, timer, 1.00);                                                // timer sucked 100 → 55 %, gone at 1.30
      MK.enterBig(tl, card, 1.30, { from: 1.45, frames: 40 });
      tl.fromTo(card, { autoAlpha: 0 }, { autoAlpha: 1, duration: 2 * F, ease: "none" }, 1.30);
      // CORAIL02 swatch: anticipation (to 0.6) then pop on « qui » + coral ring
      MK.anticipate(tl, $("seed"), 1.56, { to: 0.6 });
      MK.pop(tl, $("swatch"), 1.56, { from: 0.6 });
      tl.set($("seed"), { autoAlpha: 0 }, 1.56 + 4 * F);
      MK.ring(tl, $("cfx"), 1.56, { x: 1000, y: 170, r0: 100, r1: 200, color: "#F8571F", width: 5 });
      MK.ring(tl, $("cfx"), 1.56 + 4 * F, { x: 1000, y: 170, r0: 110, r1: 260, color: "#DF764C", width: 3, alpha: 0.6, frames: 28 });

      // ---- Scene 3 (2.18–2.95): « ce qu'elle cherche » ----
      MK.pan(tl, rig, 2.36, { x: -120, y: -60, scale: 1.08, frames: 20 });
      MK.pop(tl, $("dotA"), 2.38, { over: 0.3 });
      tl.fromTo($("linkA"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 10 * F, ease: "power2.out" }, 2.38);
      MK.pop(tl, $("chipA"), 2.54);

      // ---- Scene 4 (3.07–4.40): « et ce qui la fait hésiter » ----
      MK.pop(tl, $("dotB"), 3.45, { over: 0.3 });
      tl.fromTo($("linkB"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 10 * F, ease: "power2.out" }, 3.45);
      MK.snapZoom(tl, rig, 3.62, { from: 1.08, to: 1.3, origin: "1130px 890px" });
      MK.pop(tl, $("chipB"), 3.71);
      [3.86, 4.11].forEach(function (t) {                                       // « ! » pulses ×1.4 twice, 0.25 s each
        tl.to($("bang"), { scale: 1.4, duration: 6 * F, ease: "power2.out" }, t);
        tl.to($("bang"), { scale: 1, duration: 9 * F, ease: "power2.inOut" }, t + 6 * F);
      });

      // ---- Scene 5 (4.40–4.70): push left, accelerating — the last frame is the fastest ----
      var bfOut = MK.blurFilter($("stage"), ID + "-blur2");
      MK.exit(tl, rig, 4.40, { dir: "left", dist: 1600, frames: 18, blur: bfOut });

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
