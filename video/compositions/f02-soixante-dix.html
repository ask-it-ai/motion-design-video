<template id="f02-soixante-dix-template">
  <style>
    @font-face { font-family: "Lufga"; src: url('assets/fonts/Lufga-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
    @font-face { font-family: "Lufga"; src: url('assets/fonts/Lufga-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
    @font-face { font-family: "DM Sans"; src: url('assets/fonts/DMSans-normal-latin.woff2') format('woff2'); font-weight: 300 800; font-style: normal; font-display: block; }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Lufga", sans-serif;
      color: #F2EFEC;
    }

    /* AVANT ground: avant-bg + 44 px grid (avant-line) + avant-vignette */
    #f02-soixante-dix-bg {
      position: absolute;
      inset: 0;
      background-color: #1B1718;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 44px 44px;
      background-position: 26px 12px;
    }
    #f02-soixante-dix-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 70% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
    }

    #f02-soixante-dix-stage,
    #f02-soixante-dix-shake,
    #f02-soixante-dix-rig,
    #f02-soixante-dix-drift {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }

    /* GRID_100: 10 × 10 dots, 40 px, pitch 62 px, box 598 × 598 centred at (600, 540) */
    #f02-soixante-dix-grid {
      position: absolute;
      left: 301px;
      top: 241px;
      width: 598px;
      height: 598px;
      transform-origin: 299px 299px;
    }
    .f02-soixante-dix-dot {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #F2EFEC;
      opacity: 0.7;
      transform-origin: 50% 50%;
    }
    #f02-soixante-dix-her { position: absolute; left: 310px; top: 186px; width: 40px; height: 40px; }
    #f02-soixante-dix-her-core { position: absolute; inset: 0; border-radius: 50%; background: #F2EFEC; }
    #f02-soixante-dix-her-ring {
      position: absolute;
      left: -8px;
      top: -8px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #FFFFFF;
    }
    #f02-soixante-dix-slot {
      position: absolute;
      left: 302px;
      top: 178px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2.5px dashed #F2EFEC;
    }

    /* « 70 % » — world px sized so it reads ~300 px on screen once the camera has pushed in (×1.12) */
    #f02-soixante-dix-stat {
      position: absolute;
      left: 1030px;
      top: 352px;
      white-space: nowrap;
      font: 700 260px/1 "DM Sans", sans-serif;
      letter-spacing: -0.05em;
      color: #F2EFEC;
      transform-origin: 46% 58%;
    }
    #f02-soixante-dix-pct { color: #F8571F; margin-left: 0.1em; }

    #f02-soixante-dix-words {
      position: absolute;
      left: 1036px;
      top: 625px;
      white-space: nowrap;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    #f02-soixante-dix-words .mk-w { font-weight: 500; color: #8C8580; }
    #f02-soixante-dix-words .mk-accent { font-weight: 700; color: #F2EFEC; }
  </style>

  <div id="root" data-composition-id="f02-soixante-dix" data-fps="60" data-start="0" data-duration="3.75" data-width="1920" data-height="1080">
    <div id="f02-soixante-dix-bg" class="clip" data-start="0" data-duration="3.75" data-track-index="0"></div>

    <div id="f02-soixante-dix-stage" class="clip" data-start="0" data-duration="3.75" data-track-index="1">
      <div id="f02-soixante-dix-shake">
        <div id="f02-soixante-dix-rig">
          <div id="f02-soixante-dix-drift">
            <div id="f02-soixante-dix-grid">
              <div id="f02-soixante-dix-slot"></div>
              <div id="f02-soixante-dix-her" data-hf-motion-blur='{"shutterAngle":360,"samplesPerFrame":12}'>
                <div id="f02-soixante-dix-her-core"></div>
                <div id="f02-soixante-dix-her-ring"></div>
              </div>
            </div>
            <div id="f02-soixante-dix-stat" data-hf-motion-blur='{"shutterAngle":360,"samplesPerFrame":12}'>70<span id="f02-soixante-dix-pct">%</span></div>
            <div id="f02-soixante-dix-words"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="lib/motionkit.js"></script>
  <script>
    (function () {
      var ID = "f02-soixante-dix";
      var DUR = 3.75;
      var MK = window.MK, F = MK.F, H = MK.hash;
      var MB = '{"shutterAngle":360,"samplesPerFrame":12}';
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var stage = $("stage"), shake = $("shake"), rig = $("rig"), drift = $("drift"), grid = $("grid");
      var her = $("her"), herRing = $("her-ring"), slot = $("slot"), stat = $("stat"), words = $("words");
      var tl = gsap.timeline({ paused: true });

      // the 99 other visitors (her slot r3 c5 is the authored #her)
      var dots = [];
      for (var r = 0; r < 10; r++) {
        for (var c = 0; c < 10; c++) {
          if (r === 3 && c === 5) continue;
          var d = document.createElement("div");
          d.className = ID + "-dot";
          d.style.left = 62 * c + "px";
          d.style.top = 62 * r + "px";
          grid.insertBefore(d, slot);
          dots.push({ el: d, i: r * 10 + c });
        }
      }
      // hash-shuffled order: the first 69 leave, the last 30 stay
      var order = dots.slice().sort(function (a, b) { return H(a.i * 7.31 + 3) - H(b.i * 7.31 + 3); });
      var leavers = order.slice(0, 69), stayers = order.slice(69);
      leavers.forEach(function (o) { o.el.setAttribute("data-hf-motion-blur", MB); });

      // camera: origin on her slot (centre 631, 447)
      gsap.set(rig, { transformOrigin: "631px 447px" });
      gsap.set(words, { autoAlpha: 0 });
      gsap.set(slot, { autoAlpha: 0 });
      var gridBlur = MK.blurFilter(stage, ID + "-blur-grid"), rigBlur = MK.blurFilter(stage, ID + "-blur-rig");

      MK.drift(tl, drift, 0, DUR, { seed: 5 });

      // ════ Scene 1 (0.00–0.63) ENTRY: GRID_100 launched down, still falling, brakes ════
      gsap.set(grid, { filter: gridBlur.ref }); gridBlur.node.setAttribute("stdDeviation", "0 16"); // frame 0 already blurred
      MK.enter(tl, grid, 0, { dir: "down", dist: 800, frames: 38, blur: gridBlur });
      MK.pop(tl, herRing, 0.12, { over: 0.25 });

      // ════ Scene 2 (0.25–1.60) « Non, elle ne reviendra pas » ════
      MK.anticipate(tl, her, 0.33, { to: 0.6 });
      tl.to(her, { scale: 1, duration: 10 * F, ease: "back.out(2.5)" }, 0.33);
      MK.toss(tl, her, 0.33, { rise: 18, fall: 900, rotation: 0, fallFrames: 30 });
      tl.fromTo(slot, { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 0.5, scale: 1, duration: 14 * F, ease: "power2.out", immediateRender: false }, 0.45);
      tl.to(rig, { scale: 1.12, duration: 1.0, ease: "sine.inOut" }, 0.35);
      tl.to(slot, { scale: 1.15, duration: 5 * F, ease: "power2.out" }, 1.35);
      tl.to(slot, { scale: 1, autoAlpha: 0.25, duration: 16 * F, ease: "power2.inOut" }, 1.35 + 5 * F);

      // ════ Scene 3 (1.69–2.70) « comme 70 % » ════
      MK.anticipate(tl, grid, 2.05, { to: 0.86 });
      var impact = MK.slam(tl, stat, 1.90, { shakeEl: shake });            // impact frame = 2.05
      // spring back: MK.pop's scale curve without its alpha fade (the grid is already on screen)
      tl.to(grid, { scale: 1, duration: 4 * F, ease: "power2.out" }, impact);
      tl.to(grid, { scale: 1.12, duration: 4 * F, ease: "sine.out" }, impact + 4 * F);
      tl.to(grid, { scale: 1, duration: 18 * F, ease: "power2.inOut" }, impact + 8 * F);
      leavers.forEach(function (o, k) {
        MK.toss(tl, o.el, impact + k * F, {
          rise: 6 + 8 * H(o.i * 3.7 + 1), fall: 700 + 300 * H(o.i * 5.3 + 2), rotation: 0,
          fallFrames: 22 + Math.round(8 * H(o.i * 2.9 + 7))
        });
      });
      tl.to(stayers.map(function (o) { return o.el; }), { opacity: 0.9, duration: 12 * F, ease: "power2.out" }, impact + 6 * F);

      // ════ Scene 4 (2.69–3.45) « de vos visiteurs » ════
      tl.set(words, { autoAlpha: 1 }, 2.55);
      MK.words(tl, words, [{ w: "de", t: 2.69 }, { w: "vos", t: 2.79 }, { w: "visiteurs", t: 2.92, accent: true, letters: true }], { lead: 0.1 });

      // ════ Scene 5 (3.45–3.75) EXIT: everything accelerates up, cut on the fastest frame ════
      MK.exit(tl, rig, 3.45, { dir: "up", dist: 1400, frames: 18, blur: rigBlur });

      window.__timelines = window.__timelines || {};
      window.__timelines["f02-soixante-dix"] = tl;
    })();
  </script>
</template>
