  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "f02-soixante-dix";
      var DUR = 10.61;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var prand = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      var tl = gsap.timeline({ paused: true });

      var zoomer = $("zoomer"), world = $("world"), grid = $("grid"), her = $("her");
      var stat = $("stat"), numrow = $("numrow"), num = $("num"), d0 = $("d0"), d1 = $("d1"), pct = $("pct");
      var impact = $("impact"), label = $("label"), chart = $("chart"), near = $("near"), wall = $("wall");

      // ── setup: GRID_100 (index = row*10 + col) ──
      var HER = 3 * 10 + 4;   // row 4 / col 5
      var dots = [];
      for (var r = 0; r < 10; r++) {
        for (var c = 0; c < 10; c++) {
          var dot = document.createElement("div");
          dot.className = "f02-soixante-dix-dot";
          dot.style.left = (9 + c * 44) + "px";
          dot.style.top = (9 + r * 44) + "px";
          grid.insertBefore(dot, her);
          dots.push(dot);
        }
      }
      // ── setup: impact lines around the % ──
      var lines = $("impact-lines"), svgNS = "http://www.w3.org/2000/svg";
      for (var k = 0; k < 11; k++) {
        var a = (-135 + k * 27) * Math.PI / 180;   // 11 lines, right-side arc (skips the digits on the left)
        var ln = document.createElementNS(svgNS, "line");
        ln.setAttribute("x1", (Math.cos(a) * 138).toFixed(1));
        ln.setAttribute("y1", (Math.sin(a) * 124).toFixed(1));
        ln.setAttribute("x2", (Math.cos(a) * 172).toFixed(1));
        ln.setAttribute("y2", (Math.sin(a) * 156).toFixed(1));
        lines.appendChild(ln);
      }
      // ── setup: traffic line (Catmull-Rom → cubic Bézier) ──
      var P = [[0,236],[56,226],[110,238],[166,206],[222,212],[278,180],[334,190],[390,150],[446,160],[502,118],[558,104],[614,74],[660,46]];
      var d = "M" + P[0][0] + "," + P[0][1];
      for (var i = 0; i < P.length - 1; i++) {
        var p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
        d += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + "," + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) +
             " " + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + "," + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) +
             " " + p2[0] + "," + p2[1];
      }
      var line = $("line"), area = $("area"), areaRect = $("area-rect"), head = $("head");
      line.setAttribute("d", d);
      area.setAttribute("d", d + " L660,290 L0,290 Z");
      var LEN = line.getTotalLength();

      // ── setup: wall of 12 identical phones (4×3, 0.34 scale) ──
      var GLYPHS = '<svg width="78" height="13" viewBox="0 0 78 13"><g fill="#241F20"><rect x="0" y="8" width="3.2" height="4" rx="0.8"/><rect x="4.6" y="6" width="3.2" height="6" rx="0.8"/><rect x="9.2" y="3.5" width="3.2" height="8.5" rx="0.8"/><rect x="13.8" y="1" width="3.2" height="11" rx="0.8"/></g><g fill="none" stroke="#241F20" stroke-width="1.8" stroke-linecap="round"><path d="M24.5 4.6a10 10 0 0 1 13 0"/><path d="M27.2 7.5a6 6 0 0 1 7.6 0"/></g><circle cx="31" cy="10.6" r="1.5" fill="#241F20"/><rect x="45" y="1.2" width="25" height="10.6" rx="3" fill="none" stroke="#241F20" stroke-opacity="0.45" stroke-width="1.2"/><rect x="47" y="3.2" width="21" height="6.6" rx="1.6" fill="#241F20"/></svg>';
      var AVATAR = '<svg viewBox="0 0 36 36"><rect width="36" height="36" fill="#3A3435"/><circle cx="18" cy="14" r="6.4" fill="#8C8580"/><path d="M5.5 33c1.7-6.9 6.6-10.2 12.5-10.2S28.8 26.1 30.5 33z" fill="#8C8580"/></svg>';
      var COLS = [555, 825, 1095, 1365], ROWS = [236, 596, 956];
      var phones = [], pages = [];
      ROWS.forEach(function (cy, ri) {
        COLS.forEach(function (cx, ci) {
          var ph = document.createElement("div");
          ph.className = "f02-soixante-dix-phone";
          ph.style.left = (cx - 235) + "px";
          ph.style.top = (cy - 500) + "px";
          ph.innerHTML = '<div class="f02-soixante-dix-screen"><div class="f02-soixante-dix-pstatus"><span>9:41</span>' + GLYPHS +
            '</div><div class="f02-soixante-dix-page"></div><div class="f02-soixante-dix-island"></div></div>';
          wall.appendChild(ph);
          var av = document.createElement("div");
          av.className = "f02-soixante-dix-avatar";
          av.style.left = (cx + 74) + "px";
          av.style.top = (cy - 164) + "px";
          av.innerHTML = AVATAR;
          wall.appendChild(av);
          var bb = document.createElement("div");
          bb.className = "f02-soixante-dix-bubble";
          bb.style.left = (cx + 128) + "px";
          bb.style.top = (cy - 200) + "px";
          bb.textContent = "?";
          wall.appendChild(bb);
          var dist = Math.hypot(cx - 960, (cy - 596) * 0.8);
          phones.push({ el: ph, av: av, bb: bb, dist: dist, idx: ri * 4 + ci });
          pages.push(ph.querySelector(".f02-soixante-dix-page"));
        });
      });

      // ════ Scene 1 (0.0–1.4): grid on the cut; « Non » — her dot dims and drops ════
      tl.fromTo(zoomer, { scale: 1 }, { scale: 1.04, duration: 5.8, ease: "none" }, 0);  // slow camera drift
      tl.to(dots[HER], { opacity: 0.15, y: 8, duration: 0.5, ease: "power2.out" }, 0.04);
      tl.to(her, { opacity: 0.4, y: 8, scale: 1.08, duration: 0.5, ease: "power2.out" }, 0.04);

      // ════ Scene 2 (1.54–3.4): « comme 70 % » — count 0→70 (lands 2.29) synced with a 69-dot cascade ════
      var COUNT_AT = 1.22, COUNT_DUR = 1.07;   // power2.out, lands exactly at 2.29
      tl.fromTo(numrow, { opacity: 0, y: 36, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 1.14);
      var counter = { v: 0 };
      tl.fromTo(counter, { v: 0 }, {
        v: 70, duration: COUNT_DUR, ease: "power2.out",
        onUpdate: function () {
          var n = Math.round(counter.v);
          d0.textContent = n >= 10 ? String(Math.floor(n / 10)) : "";
          d1.textContent = String(n % 10);
        }
      }, COUNT_AT);
      tl.fromTo(num, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: "power2.out" }, COUNT_AT);
      // cascade: index-derived pseudo-random order; dot k dims as the counter passes k+2 (her = #1)
      var others = [];
      for (i = 0; i < 100; i++) if (i !== HER) others.push({ i: i, key: prand(i * 7.13 + 3.7) });
      others.sort(function (a, b) { return a.key - b.key; });
      for (k = 0; k < 69; k++) {
        var y = Math.min(0.9995, (k + 1.5) / 70);
        var at = COUNT_AT + COUNT_DUR * (1 - Math.sqrt(1 - y));   // inverse of power2.out
        tl.to(dots[others[k].i], { opacity: 0.12, scale: 0.86, duration: 0.16, ease: "power1.out" }, at);
      }
      // number slam on the coral « % » + impact lines, then the label
      tl.fromTo(pct, { yPercent: -120, opacity: 0, filter: "blur(12px)" }, { yPercent: 6, opacity: 1, filter: "blur(0px)", duration: 0.08, ease: "power4.in" }, 2.17);
      tl.to(pct, { yPercent: 0, duration: 0.27, ease: "back.out(2)" }, 2.25);
      tl.set(impact, { opacity: 1, scale: 1 }, 2.25);
      tl.to(impact, { opacity: 0, scale: 1.6, duration: 0.25, ease: "power2.out" }, 2.25);
      tl.fromTo(label, { opacity: 0, y: 20, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 2.38);

      // ════ Scene 3 (3.78–5.6): « Le problème, ce n'est pas votre trafic » — camera pans left 700px ════
      tl.to(world, { x: -700, duration: 0.9, ease: "power3.inOut" }, 3.55);
      tl.fromTo(near, { x: 1000 }, { x: 0, duration: 0.9, ease: "power3.inOut" }, 3.55); // parallax: nearer chart plane travels farther (waits off-screen right)
      tl.to(grid, { "--dof": "8px", opacity: 0.5, duration: 0.9, ease: "power2.inOut" }, 3.6);
      tl.to(stat, { "--dof": "6px", opacity: 0.55, duration: 0.9, ease: "power2.inOut" }, 3.6);
      tl.set(chart, { filter: "blur(0px)" }, 3.7);
      tl.to(chart, { filter: "blur(5px)", duration: 0.28, ease: "power2.in" }, 3.72);       // motion blur at peak speed
      tl.to(chart, { filter: "blur(0px)", duration: 0.42, ease: "power2.out" }, 4.0);
      tl.fromTo($("chart-label"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 4.05);
      // the traffic line draws upward (one driver: stroke draw + area reveal + head dot)
      var draw = { p: 0 };
      tl.fromTo(draw, { p: 0 }, {
        p: 1, duration: 0.85, ease: "power2.inOut",
        onUpdate: function () {
          var p = draw.p;
          line.setAttribute("stroke-dashoffset", String(1 - p));
          areaRect.setAttribute("width", String(p * 690));
          var pt = line.getPointAtLength(p * LEN);

      tl.fromTo($("tick-badge"), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.02);

      // ════ Scene 4 (6.11–8.4): « tout le monde voit la même chose » — zoom-through into a wall of 12 identical phones ════
      tl.set(zoomer, { filter: "blur(0px)" }, 5.8);

      tl.to(pages, { backgroundPosition: "0px -300px", duration: 0.62, ease: "power2.inOut" }, 7.45);

      // ════ Scene 5 (8.51–10.61): « et personne n'est là pour guider » — a « ? » pops above each phone; nothing answers ════
      var scattered = phones.slice().sort(function (a, b) { return prand(a.idx * 3.3 + 1.9) - prand(b.idx * 3.3 + 1.9); });
      scattered.forEach(function (o, j) {

        tl.fromTo(o.bb, { scale: 0, opacity: 0, y: 8 }, { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, t0);
