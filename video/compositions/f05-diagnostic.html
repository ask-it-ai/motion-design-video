        <div id="f05-diagnostic-c2" class="f05-diagnostic-cslot" style="left: 250px; top: 152px; width: 294px"><div class="f05-diagnostic-chip"><i></i><span>Peau sensible&nbsp;<span class="f05-diagnostic-num">3/10</span></span></div></div>
        <div id="f05-diagnostic-c3" class="f05-diagnostic-cslot" style="left: 32px; top: 220px; width: 300px"><div class="f05-diagnostic-chip"><i></i><span>Routine essentielle</span></div></div>
        <div id="f05-diagnostic-c4" class="f05-diagnostic-cslot" style="left: 32px; top: 288px; width: 400px"><div class="f05-diagnostic-chip f05-diagnostic-tint"><i></i><span>Préoccupation&nbsp;: teint terne</span></div></div>
        <div id="f05-diagnostic-c5" class="f05-diagnostic-cslot" style="left: 32px; top: 356px; width: 388px"><div class="f05-diagnostic-chip"><b>!</b><span>Frein&nbsp;: peur des réactions</span></div></div>

        <div class="f05-diagnostic-prog-label">Profil complété</div>
        <div id="f05-diagnostic-prog-val">0 %</div>
        <div class="f05-diagnostic-prog-track"><div id="f05-diagnostic-prog-fill"></div></div>
      </div>

      <div id="f05-diagnostic-timer">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="#f1eeea" stroke-width="6"></circle><circle id="f05-diagnostic-ring-fill" cx="32" cy="32" r="27" fill="none" stroke="#f8571f" stroke-width="6" stroke-linecap="round" stroke-dasharray="169.65" stroke-dashoffset="169.65" transform="rotate(-90 32 32)"></circle><circle cx="32" cy="34" r="9" fill="none" stroke="#6c6560" stroke-width="2.4"></circle><path d="M32 34v-4.6M29.4 22.6h5.2M32 22.6v2.4" fill="none" stroke="#6c6560" stroke-width="2.4" stroke-linecap="round"></path></svg>
        <span id="f05-diagnostic-timer-val">0 s</span>
      </div>

      <div id="f05-diagnostic-swatch"><div id="f05-diagnostic-swatch-in"></div></div>

      <div id="f05-diagnostic-touch">
        <div class="f05-diagnostic-ripple"></div>
        <div class="f05-diagnostic-touch-dot"></div>
      </div>
      </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "f05-diagnostic";
      var $ = function (id) { return document.getElementById(ID + "-" + id); };
      var q = function (el, sel) { return el.querySelector(sel); };
      var tl = gsap.timeline({ paused: true });
      var REST_SHADOW = "0px 18px 40px -18px rgba(36,31,32,0.18), 0px 2px 6px 0px rgba(36,31,32,0.05)";
      var FLY_SHADOW = "0px 34px 60px -14px rgba(36,31,32,0.34), 0px 10px 22px -6px rgba(248,87,31,0.30)";

      // counter that rolls through integer values on frame steps (no callbacks → seek-safe)
      var roll = function (el, from, to, at, dur, suffix) {
        var steps = Math.max(1, Math.round(dur * 30));
        for (var k = 1; k <= steps; k++) {
          var p = k / steps;
          var e = 1 - Math.pow(1 - p, 3);
          tl.set(el, { textContent: Math.round(from + (to - from) * e) + suffix }, at + (k / steps) * dur);
        }
      };
      // page push inside the phone: old screen out left, new one in from the right
      var slide = function (outEl, inEl, at) {
        tl.to(outEl, { x: -442, duration: 0.42, ease: "power3.inOut" }, at);
        tl.fromTo(inEl, { x: 442, opacity: 1 }, { x: 0, opacity: 1, duration: 0.42, ease: "power3.inOut" }, at);
      };
      var fadeIn = function (el, at, dur) {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur, ease: "power2.inOut" }, at);
      };

      // PHONE_HERO screen → frame coordinates (phone centre 700,520 · scale 0.9 · screen 442×972)
      var scr = function (sx, sy) { return [700 + (sx - 221) * 0.9, 520 + (sy - 486) * 0.9]; };
      var CARD = [1020, 236];

      /* ════════ Scene 1 · 0–1.9 s · « D'abord, le diagnostic » ════════ */
      var pill1 = $("pill-1");
      tl.to(pill1, { backgroundColor: "#fdeee7", borderColor: "#f8571f", duration: 0.3, ease: "power2.out" }, 0);
      tl.to(pill1, { scale: 1.05, duration: 0.14, ease: "power2.out" }, 0);
      tl.to(pill1, { scale: 1, duration: 0.3, ease: "power2.inOut" }, 0.14);
      tl.fromTo($("pill-ring"), { scale: 1, opacity: 0.75 }, { scale: 1.16, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, 0.04);
      tl.to([$("pill-2"), $("pill-3")], { opacity: 0.3, duration: 0.35, ease: "power2.out" }, 0.04);
      // the PILLS_ROW drift continues at f04's exit velocity (1.13 %/s)
      tl.fromTo($("pills-drift"), { scale: 1 }, { scale: 1.018, duration: 1.6, ease: "none" }, 0);
      // « diagnostic » — camera pushes into pill 01 (×2.6) with blur at peak speed
      tl.fromTo($("pills-cam"), { scale: 1 }, { scale: 2.6, duration: 0.7, ease: "power3.inOut" }, 0.84);
      tl.fromTo($("pills-cam"), { filter: "blur(0px)" }, { filter: "blur(9px)", duration: 0.42, ease: "power2.in" }, 0.98);
      tl.to($("pills-cam"), { opacity: 0, duration: 0.32, ease: "power2.in" }, 1.1);
      tl.set($("pills-cam"), { filter: "none" }, 1.45);
      // …and PHONE_HERO rises into place out of it (perspective rise, settles flat)
      var phone = $("phone-pos");
      tl.fromTo(phone, { x: -150, y: 330, scale: 0.6, rotationX: 30, transformPerspective: 1400, filter: "blur(10px)" }, { x: 0, y: 0, scale: 1, rotationX: 7, filter: "blur(0px)", duration: 0.62, ease: "power3.out" }, 1.0);
      tl.fromTo(phone, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 1.1);
      tl.to(phone, { rotationX: 0, duration: 0.5, ease: "sine.out" }, 1.62);
      tl.set(phone, { filter: "none" }, 1.62);
      // grid-bg mesh: parallax with the push, then drifts back to its canonical state
      tl.fromTo($("mesh"), { scale: 1, x: 0, y: 0 }, { scale: 1.045, x: 28, y: -12, duration: 3, ease: "sine.inOut" }, 0);
      tl.to($("mesh"), { scale: 1, x: 0, y: 0, duration: 11.75, ease: "sine.inOut" }, 3);

      /* ════════ Scene 2 · 1.84–3.9 s · « intégré à votre site, à votre image » ════════ */
      // theme-crossfade-morph: the phone frame is the still anchor; skins + logo relay crossfade
      tl.fromTo($("brand"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)" }, 1.84);
      [[2.3, "plpp", "p00", "skin-lpp", "skin-endro"], [3.2, "p00", "plpp", "skin-endro", "skin-lpp"]].forEach(function (k) {
        tl.fromTo($(k[1]), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut", immediateRender: k[0] < 3 }, k[0]);
        tl.to($(k[2]), { opacity: 0, duration: 0.3, ease: "power2.inOut" }, k[0]);
        tl.fromTo($(k[3]), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut", immediateRender: k[0] < 3 }, k[0]);
        tl.to($(k[4]), { opacity: 0, duration: 0.3, ease: "power2.inOut" }, k[0]);
      });
      tl.to($("brand"), { scale: 0.85, opacity: 0, duration: 0.28, ease: "power2.in" }, 4.22);

      /* ════════ Scene 3 · 4.38–6.4 s · « Il pose à chaque visiteuse les bonnes questions » ════════ */
      var card = $("card");
      tl.fromTo(card, { x: 60, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 4.38);
      tl.set(card, { filter: "none" }, 4.9);
      tl.fromTo(q(card, ".f05-diagnostic-avatar"), { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 4.46);
      tl.fromTo(q(card, ".f05-diagnostic-name"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 4.5);
      tl.fromTo($("subskel"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, 4.54);
      Array.prototype.slice.call(card.querySelectorAll(".f05-diagnostic-skel")).forEach(function (s, k) {
        tl.fromTo(s, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, 4.56 + k * 0.04);
      });
      tl.fromTo([q(card, ".f05-diagnostic-prog-label"), $("prog-val"), q(card, ".f05-diagnostic-prog-track")], { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 4.66);
      // phone: first name typed (00 → 01), then the first question slides in
      fadeIn($("p01"), 4.5, 0.2);
      tl.set($("p00"), { opacity: 0 }, 4.75);
      slide($("p01"), $("p04"), 5.6);

      /* ════════ Scene 4 · 6.5–9.2 s · three taps → answer chips fly into the profile ════════ */
      var touch = $("touch");
      var dot = q(touch, ".f05-diagnostic-touch-dot");
      var ripple = q(touch, ".f05-diagnostic-ripple");
      var T1 = scr(323.6, 497.6); // selected skin photo (04)
      var T2 = scr(141.7, 686.1); // sensitivity slider knob (05)
      var T3 = scr(221, 668.2); // « Essentielle » (12)
      var tap = function (at, flashEl) {
        tl.to(dot, { scale: 0.85, duration: 0.08, ease: "power2.out" }, at - 0.05);
        tl.to(dot, { scale: 1, duration: 0.18, ease: "power2.out" }, at + 0.03);
        tl.fromTo(ripple, { scale: 1, opacity: 0.6 }, { scale: 2.2, opacity: 0, duration: 0.38, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(flashEl, { opacity: 0 }, { opacity: 0.45, duration: 0.07, ease: "power1.out" }, at);
        tl.to(flashEl, { opacity: 0, duration: 0.3, ease: "power1.in" }, at + 0.07);
      };
      // answer chip flies on an arc from the tap point and lands in its card slot (card-morph landing)
      var fly = function (slotId, from, slotCx, slotCy, at, arc) {
        var slot = $(slotId);
        var chip = q(slot, ".f05-diagnostic-chip");
        var cx = CARD[0] + slotCx;
        var cy = CARD[1] + slotCy;
        tl.fromTo(slot, { x: from[0] - cx, y: from[1] - cy }, { x: 0, y: 0, duration: 0.55, ease: "power2.inOut" }, at);
        tl.fromTo(chip, { y: 0 }, { y: -arc, duration: 0.275, ease: "power1.out" }, at);
        tl.to(chip, { y: 0, duration: 0.275, ease: "power1.in" }, at + 0.275);
        tl.fromTo(chip, { scale: 0.4, boxShadow: FLY_SHADOW, borderColor: "rgba(248,87,31,0.85)" }, { scale: 1, boxShadow: REST_SHADOW, borderColor: "rgba(36,31,32,0.10)", duration: 0.55, ease: "power2.inOut" }, at);
        tl.fromTo(chip, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at);
      };
      var skels = Array.prototype.slice.call(card.querySelectorAll(".f05-diagnostic-skel"));
      var step = function (at, from, to) {
        if (from === 0) tl.fromTo($("prog-fill"), { scaleX: 0 }, { scaleX: to / 100, duration: 0.45, ease: "power3.out" }, at);
        else tl.to($("prog-fill"), { scaleX: to / 100, duration: 0.45, ease: "power3.out" }, at);
        roll($("prog-val"), from, to, at, 0.36, " %");
      };

      tl.fromTo(touch, { x: 120, y: 150, scale: 0.8, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.34, ease: "power2.inOut" }, 6.52);
      tap(6.89, $("flash-1"));
      fly("c1", T1, 32 + 103, 152 + 28, 6.92, 110);
      tl.to(skels[0], { opacity: 0, duration: 0.2 }, 7.36);
      step(7.47, 0, 35);
      slide($("p04"), $("p05"), 7.06);

      tl.to(touch, { x: T2[0] - T1[0], y: T2[1] - T1[1], duration: 0.25, ease: "power2.inOut" }, 7.38);
      tap(7.68, $("flash-2"));
      fly("c2", T2, 250 + 147, 152 + 28, 7.71, 130);
      tl.to(skels[1], { opacity: 0, duration: 0.2 }, 8.15);
      step(8.26, 35, 70);
      slide($("p05"), $("p12"), 7.86);

      tl.to(touch, { x: T3[0] - T1[0], y: T3[1] - T1[1], duration: 0.25, ease: "power2.inOut" }, 8.24);
      tap(8.54, $("flash-3"));
      fly("c3", T3, 32 + 150, 220 + 28, 8.57, 120);
      tl.to(skels[2], { opacity: 0, duration: 0.2 }, 9.01);
      step(9.12, 70, 100);
      tl.to(touch, { x: T3[0] - T1[0] + 10, y: T3[1] - T1[1] + 40, scale: 0.8, opacity: 0, duration: 0.3, ease: "power2.in" }, 8.86);

      /* ════════ Scene 5 · 9.56–11.95 s · « En trente secondes… qui elle est » ════════ */
      tl.fromTo($("timer"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.7)" }, 9.56);
      tl.fromTo($("ring-fill"), { strokeDashoffset: 169.65 }, { strokeDashoffset: 0, duration: 0.46, ease: "power2.inOut" }, 9.66);
      roll($("timer-val"), 0, 30, 9.66, 0.46, " s");
      tl.fromTo($("timer-val"), { scale: 1.16 }, { scale: 1, duration: 0.32, ease: "power2.out", immediateRender: false }, 10.12);
      // loading screen: the Nuancier narrows to her profile
      fadeIn($("p16"), 10.76, 0.25);
      tl.fromTo($("spot"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 11.0);
      tl.fromTo($("hl"), { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.6)" }, 11.08);
      // the CORAIL02 swatch lifts off and lands as the profile dot (card-morph: size + radius)
      var sw = $("swatch");
      var swIn = $("swatch-in");
      var DOT = [CARD[0] + 153, CARD[1] + 103];
      tl.fromTo(swIn, { opacity: 0, scale: 1, boxShadow: "0px 0px 0px 0px rgba(36,31,32,0)" }, { opacity: 1, scale: 1.3, boxShadow: "0px 16px 30px -8px rgba(36,31,32,0.40)", duration: 0.12, ease: "power2.out" }, 11.2);
      tl.fromTo(sw, { x: 0, y: 0 }, { x: DOT[0] - 699.5, y: DOT[1] - 511.3, duration: 0.46, ease: "power2.inOut" }, 11.32);
      tl.to(swIn, { y: -70, duration: 0.23, ease: "power1.out" }, 11.32);
      tl.to(swIn, { y: 0, duration: 0.23, ease: "power1.in" }, 11.55);
      tl.to(swIn, { scale: 14 / 32, borderRadius: 16, boxShadow: "0px 0px 0px 0px rgba(36,31,32,0)", duration: 0.46, ease: "power2.inOut" }, 11.32);
      // « Profil CORAIL02 » wipes in next to it (mask travels −240 → 0, text counter-travels)
      tl.to($("subskel"), { opacity: 0, duration: 0.2 }, 11.52);
      tl.fromTo($("sub"), { x: -240 }, { x: 0, duration: 0.5, ease: "expo.inOut" }, 11.54);
      tl.fromTo($("sub-inner"), { x: 230 }, { x: 0, duration: 0.5, ease: "expo.inOut" }, 11.54);

      /* ════════ Scene 6 · 11.94–14.75 s · « ce qu'elle cherche… ce qui la fait hésiter » ════════ */
      var pop = function (slotId, at) {
        var chip = q($(slotId), ".f05-diagnostic-chip");
        tl.fromTo(chip, { scale: 0.4, opacity: 0, y: 14 }, { scale: 1, opacity: 1, y: 0, duration: 0.46, ease: "back.out(1.6)" }, at);
      };
      pop("c4", 12.1);
      tl.to(skels[3], { opacity: 0, duration: 0.2 }, 12.3);
      pop("c5", 13.36);
      tl.to(skels[4], { opacity: 0, duration: 0.2 }, 13.56);
      tl.fromTo(q($("c5"), "b"), { scale: 0 }, { scale: 1, duration: 0.36, ease: "back.out(2.4)" }, 13.5);
      // the Nuancier resolves into her result page — PHONE_HERO on the CORAIL02 header (f06 handoff)
      fadeIn($("p17"), 13.9, 0.35);
      // a slow breathing drift on the whole stage, landing exactly back on PHONE_HERO at 14.75
      tl.fromTo($("stage-drift"), { scale: 1 }, { scale: 1.018, duration: 2.7, ease: "sine.inOut" }, 9.2);
      tl.to($("stage-drift"), { scale: 1, duration: 2.85, ease: "sine.inOut" }, 11.9);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
