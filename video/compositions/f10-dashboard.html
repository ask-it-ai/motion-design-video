  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <script>
    (function () {
      var ID = "f10-dashboard", DUR = 6.5;
      var MK = window.MK, F = MK.F;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var mk = function (tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = ID + "-" + cls; if (txt !== undefined) e.textContent = txt; return e; };
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var tl = gsap.timeline({ paused: true });
      var shake = $("shake"), rig = $("rig"), plane = $("plane"), dof = $("dof"), sheet = $("sheet");

      // ---- build-time DOM (synchronous, deterministic) ----
      // fixed-width digit slots (DM Sans digits are proportional) — v3 counter
      function makeCounter(el, finalStr) {
        var slots = [];
        Array.from(finalStr).forEach(function (ch) {
          if (/\d/.test(ch)) { var s = mk("span", "sd"); slots.push(s); el.appendChild(s); } else el.appendChild(mk("span", "ss", " "));
        });
        return function (v) {
          var d = String(Math.round(v));
          for (var i = 0; i < slots.length; i++) { var k = d.length - slots.length + i; slots[i].textContent = k >= 0 ? d[k] : ""; }
        };
      }
      var revSet = makeCounter($("revdig"), "78 343"), k1Set = makeCounter($("k1"), "11 395"), k2Set = makeCounter($("k2"), "1 347");
      // persona rows (v3 data): loading skeletons, the portraits land at the end of the shot
      var avs = [$("av1"), $("av2"), $("av3")], names = [$("nm1"), $("nm2"), $("nm3")], sks = [$("sk1"), $("sk2"), $("sk3")];
      // funnel (loading): skeleton bars at the v3 proportions + labels
      [["Commencés", 150], ["Arrivées au contact", 139.8], ["Terminés", 127.8], ["Achats", 17.7]].forEach(function (f, i) {
        var cx = 85.5 + i * 171, bar = mk("div", "fbar"), lab = mk("div", "flab", f[0]);
        bar.style.cssText = "left:" + (cx - 52) + "px;top:" + (238 - f[1]) + "px;height:" + f[1] + "px";
        lab.style.left = (cx - 85) + "px";
        $("fun").appendChild(bar); $("fun").appendChild(lab);
      });
      // Excel: 10×14 grid of numbers (deterministic)
      "ABCDEFGHIJ".split("").forEach(function (c, i) { var h = mk("div", "xh", c); h.style.cssText = "left:" + (44 + i * 85.6) + "px;top:6px;width:85.6px"; $("xlcols").appendChild(h); });
      for (var r = 1; r <= 14; r++) { var h = mk("div", "xh", String(r)); h.style.cssText = "left:0;top:" + (7 + (r - 1) * 32) + "px;width:44px"; $("xlrows").appendChild(h); }
      var AMT = ["16,90", "59,60", "10,90", "14,90", "72,50", "29,80", "45,30", "21,80", "33,70"];
      for (var rr = 0; rr < 14; rr++) for (var c = 0; c < 10; c++) {
        var q = MK.hash(rr * 13 + c * 7 + 3), t = "";
        if (q < 0.1 && c > 1) continue;
        if (c === 0) t = "0" + (1 + Math.floor(rr / 2)) + "/09";
        else if (c === 1) t = String(10482 + rr * 3 + Math.floor(q * 3));
        else if (c === 2) t = String(1 + Math.floor(q * 3));
        else if (c === 5) t = rr === 4 || rr === 9 ? "#N/A" : (q * 40).toFixed(1).replace(".", ",") + " %";
        else if (c >= 7) t = String(Math.floor(q * 4000 + 120));
        else t = AMT[Math.floor(q * AMT.length)];
        var e = mk("div", "xc", t);
        e.style.cssText = "left:" + (44 + c * 85.6) + "px;top:" + (28 + rr * 32) + "px;" + (t === "#N/A" ? "color:#C0392B;" : "");
        $("xlgrid").appendChild(e);
      }
      // chart line: measured length, two-component dash so the round cap leaves no dot (v3)
      var line = $("line"), len = line.getTotalLength();
      gsap.set(line, { strokeDasharray: len + " " + (len + 24), strokeDashoffset: len + 10 });
      var lo = 0, hi = len;
      for (var it = 0; it < 30; it++) { var mid = (lo + hi) / 2; if (line.getPointAtLength(mid).x < 653) lo = mid; else hi = mid; }
      var drawEase = gsap.parseEase("sine.inOut"), fPeak = (lo + 10) / (len + 10), a = 0, b2 = 1;
      for (var k = 0; k < 30; k++) { var m = (a + b2) / 2; if (drawEase(m) < fPeak) a = m; else b2 = m; }
      var tPeak = 4.0 + 0.9 * a;

      // initial camera/plane attitude
      gsap.set(plane, { rotationX: 62, rotation: -12, scale: 1.25 });
      gsap.set(sheet, { rotation: 4 });
      gsap.set($("peak"), { transformOrigin: "50% 50%" });
      tl.fromTo($("mesh"), { x: 0, y: 0, scale: 1 }, { x: -46, y: -16, scale: 1.06, duration: DUR, ease: "sine.inOut" }, 0);

      // ---- Scene 1 (0.00–1.30): launched left on a tilted plane, straightens on « votre dashboard » ----
      var bfPlane = MK.blurFilter(root, ID + "-blur1");
      MK.enter(tl, plane, 0, { dir: "left", dist: 1000, frames: 38, blur: bfPlane });
      MK.pop(tl, $("chip"), 0.17, { inner: $("chipnum") });
      tl.to(plane, { rotationX: 4, rotation: 0, scale: 0.92, duration: 30 * F, ease: "power3.inOut" }, 0.80);
      tl.to(plane, { rotationX: 2, rotationY: -2.5, duration: 4.9, ease: "sine.inOut" }, 1.30); // slight 3D attitude, never frozen
      // the dashboard wakes up on « dashboard »
      MK.count(tl, 1.16, { from: 0, to: 11395, dur: 0.55, render: k1Set });
      MK.count(tl, 1.20, { from: 0, to: 1347, dur: 0.55, render: k2Set });
      MK.pop(tl, $("k3"), 1.24, { over: 0.2 });
      MK.pop(tl, $("k4"), 1.28, { over: 0.2 });

      // ---- Scene 2 (1.84–3.60): « Adieu le tableau Excel » — slam, crumple, toss ----
      var bfSheet = MK.blurFilter(root, ID + "-blur3");
      MK.slam(tl, sheet, 1.84, { from: 3, shakeEl: shake, shakePx: 14 }); // impact 1.99 on « Adieu »
      bfSheet.ramp(tl, sheet, 1.84, 9 * F, 3, 12, "xy", "power1.in");
      bfSheet.clear(tl, sheet, 1.84 + 9 * F);
      tl.fromTo(dof, { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 8 * F, ease: "power2.out" }, 1.90);
      tl.to(sheet, { rotation: 2.4, duration: 0.7, ease: "sine.inOut" }, 2.0);
      var SEL = [[2.37, 557.6, 124, 172.2, 130], [2.54, 129.6, 348, 343.4, 98]];
      SEL.forEach(function (s) { tl.set($("xlsel"), { left: s[1] - 1, top: s[2], width: s[3] + 1, height: s[4] + 1 }, s[0]); });
      // crumple anticipation over the 8 frames before « Excel », then the toss with gravity
      MK.anticipate(tl, sheet, 2.86, { to: 0.55 });
      tl.to(sheet, { rotation: -12, duration: 8 * F, ease: "sine.inOut" }, 2.86 - 8 * F);
      tl.to($("sheetin"), { scaleY: 0.5, borderRadius: 60, duration: 8 * F, ease: "sine.inOut" }, 2.86 - 8 * F);
      tl.fromTo($("crease"), { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "power2.out" }, 2.86 - 7 * F);
      var gone = MK.toss(tl, sheet, 2.86, { rise: 90, fall: 1400, rotation: -40, fallFrames: 24, x: 300 });
      bfSheet.ramp(tl, sheet, 2.86 + 18 * F, 24 * F, 0, 16, "y", "power2.in");
      bfSheet.clear(tl, sheet, gone);
      tl.set(sheet, { autoAlpha: 0 }, gone);
      tl.fromTo(dof, { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 12 * F, ease: "power2.out", immediateRender: false }, 2.95);

      // ---- Scene 3 (3.55–5.70): snap onto the revenue card, the count with restraint ----
      MK.snapZoom(tl, rig, 3.55, { from: 1, to: 1.75, origin: "703px 491px", blurEl: dof });
      tl.to($("revsk"), { autoAlpha: 0, duration: 6 * F, ease: "power1.out" }, 3.90);
      tl.fromTo($("revnum"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 8 * F, ease: "power2.out" }, 3.95);
      var fin = MK.count(tl, 3.95, { from: 0, to: 78343, dur: 0.95, penultimate: 78290, holdFrames: 10, render: revSet }); // ≈ 5.07 on « rapporte »
      tl.to(line, { strokeDashoffset: 0, duration: 0.9, ease: "sine.inOut" }, 4.0);
      tl.fromTo($("area"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.out" }, 4.35);
      MK.pop(tl, $("peak"), tPeak, { over: 0.35 });
      MK.pop(tl, $("tip"), 4.95, { over: 0.2 });
      tl.to($("revnum"), { scale: 1.04, duration: 3 * F, ease: "power2.out" }, fin);
      tl.to($("revnum"), { scale: 1, duration: 14 * F, ease: "power2.inOut" }, fin + 3 * F);
      MK.pop(tl, $("coin"), fin, { over: 0.25 });
      MK.ring(tl, $("revfx"), fin, { x: 346, y: 82, r1: 84, color: "#F8571F" });
      // lock 10 frames, then the record peak breathes and the personas start loading (« qui sont vos »)
      MK.ring(tl, $("revfx"), 5.42, { x: 653, y: 174, r1: 44, width: 3, color: "#F8571F" });
      tl.to($("peak"), { scale: 1.4, duration: 4 * F, ease: "power2.out" }, 5.42);
      tl.to($("peak"), { scale: 1, duration: 16 * F, ease: "power2.inOut" }, 5.42 + 4 * F);
      tl.fromTo($("shim"), { x: -300 }, { x: 700, duration: 0.5, ease: "sine.inOut" }, 5.66);
      MK.each(avs, 5.92, 4, function (el, t, i) {
        MK.pop(tl, el, t, { over: 0.22 });
        tl.to(sks[i], { autoAlpha: 0, duration: 4 * F, ease: "none" }, t + 2 * F);
        tl.fromTo(names[i], { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 10 * F, ease: "power2.out" }, t + 2 * F);
      });

      // ---- Scene 4 (6.20–6.50): the camera scrolls down — content accelerates up, last frame fastest ----
      var bfRig = MK.blurFilter(root, ID + "-blur2");
      MK.exit(tl, rig, 6.20, { dir: "up", dist: 1400, frames: 18, blur: bfRig });

      MK.drift(tl, $("drift"), 0, DUR, { seed: 10 });
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
