                  <path d="M22 140c0-28 21.5-48 48-48s48 20 48 48z" fill="#bdb6ae"></path>
                </svg>
                <img class="f04-bascule-photo" src="assets/personas/claire.webp" alt="Claire" />
              </div>
              <div id="f04-bascule-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5.2 8h13.6l-1.1 11.6a1.6 1.6 0 0 1-1.6 1.4H7.9a1.6 1.6 0 0 1-1.6-1.4z"></path>
                  <path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"></path>
                </svg>
                <span>Cliente</span>
              </div>
              <div class="f04-bascule-tagslot"><div id="f04-bascule-tag-anon" class="f04-bascule-tag"><i></i><span>Visiteuse anonyme</span></div></div>
              <div class="f04-bascule-tagslot"><div id="f04-bascule-tag-name" class="f04-bascule-tag"><span>Claire</span></div></div>
            </div>

            <div id="f04-bascule-chip-1" class="f04-bascule-chip" style="left: 740px; top: 458px; width: 148px"><i></i><span><span class="f04-bascule-num">35</span>&nbsp;ans</span></div>
            <div id="f04-bascule-chip-2" class="f04-bascule-chip" style="left: 906px; top: 458px; width: 206px"><i></i><span>Peau mixte</span></div>
            <div id="f04-bascule-chip-3" class="f04-bascule-chip" style="left: 790px; top: 528px; width: 200px"><i></i><span>Teint terne</span></div>
            <div id="f04-bascule-chip-4" class="f04-bascule-chip" style="left: 1008px; top: 528px; width: 300px"><i></i><span>Routine essentielle</span></div>
          </div>
        </div>
      </div>

      <!-- PILLS_ROW: centres x 520 / 960 / 1400, y 540, height 88 -->
      <div id="f04-bascule-pills-drift">
        <div class="f04-bascule-slot" style="left: 520px">
          <div id="f04-bascule-pill-1" class="f04-bascule-pill"><span class="f04-bascule-pill-num">01</span><span class="f04-bascule-pill-label">Diagnostic</span></div>
        </div>
        <div class="f04-bascule-slot" style="left: 960px">
          <div id="f04-bascule-pill-2" class="f04-bascule-pill"><span class="f04-bascule-pill-num">02</span><span class="f04-bascule-pill-label">Recommandation</span></div>
        </div>
        <div class="f04-bascule-slot" style="left: 1400px">
          <div id="f04-bascule-pill-3" class="f04-bascule-pill"><span class="f04-bascule-pill-num">03</span><span class="f04-bascule-pill-label">Dashboard</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "f04-bascule";
      var $ = function (id) {
        return document.getElementById(ID + "-" + id);
      };
      var $$ = function (sel) {
        return Array.prototype.slice.call(document.querySelectorAll(sel));
      };
      var tl = gsap.timeline({ paused: true });

      // Deterministic hash — every glitch value is a pure function of (step, index).
      var hash = function (n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      /* ════════ Scene 1 · 0.0–1.1 s · « Bon… ça, c'était » — rewind glitch ════════ */
      var base = $("avant-base");
      var scrubSrc = base.firstElementChild;
      var slicesWrap = $("slices");
      var SLICES = 8;
      var slices = [];
      for (var i = 0; i < SLICES; i++) {
        var s = document.createElement("div");
        s.className = "f04-bascule-avant-layer f04-bascule-slice";
        var top = (i * 100) / SLICES;
        var bottom = 100 - ((i + 1) * 100) / SLICES;
        s.style.clipPath = "inset(" + top.toFixed(3) + "% -10% " + bottom.toFixed(3) + "% -10%)";
        var c = scrubSrc.cloneNode(true);
        c.firstElementChild.removeAttribute("id");
        s.appendChild(c);
        slicesWrap.appendChild(s);
        slices.push(s);
      }
      // warm + cool chromatic ghosts (RGB split of the blurred content), screen-blended above
      var ghosts = ["is-warm", "is-cool"].map(function (cls) {
        var g = document.createElement("div");
        g.className = "f04-bascule-avant-layer f04-bascule-ghost " + cls;
        var c = scrubSrc.cloneNode(true);
        c.firstElementChild.removeAttribute("id");
        g.appendChild(c);
        slicesWrap.appendChild(g);
        return g;
      });
      var scrubs = $$("#" + ID + "-avant .f04-bascule-scrub");
      var tracks = $$("#" + ID + "-avant .f04-bascule-track");

      // The f03 camera push (scale 1.08) rewinds while the tape scrubs.
      tl.fromTo($("avant-cam"), { scale: 1.08 }, { scale: 1.0, duration: 0.9, ease: "power2.inOut" }, 0.1);

      // Panel scrub: x −40 then +60, twice — stepped like a tape, then settles.
      var scrubMoves = [
        [0.12, -40, 0.08, "steps(3)"],
        [0.27, 60, 0.1, "steps(4)"],
        [0.56, -40, 0.08, "steps(3)"],
        [0.71, 60, 0.1, "steps(4)"],
        [0.88, 0, 0.16, "power3.out"],
      ];
      scrubMoves.forEach(function (m, k) {
        if (k === 0) tl.fromTo(scrubs, { x: 0 }, { x: m[1], duration: m[2], ease: m[3] }, m[0]);
        else tl.to(scrubs, { x: m[1], duration: m[2], ease: m[3] }, m[0]);
      });

      // Two bursts: bands tear on a quantized hash, RGB ghosts jitter, tracking lines flicker.
      var JITTER = 1 / 15;
      [
        { start: 0.12, steps: 6, seed: 3 },
        { start: 0.56, steps: 6, seed: 17 },
      ].forEach(function (b) {
        tl.set(base, { autoAlpha: 0 }, b.start);
        tl.set(slices, { autoAlpha: 1 }, b.start);
        tl.set(ghosts, { autoAlpha: 0.6 }, b.start);
        tl.set(tracks, { autoAlpha: 1 }, b.start);
        for (var k = 0; k < b.steps; k++) {
          var t = b.start + k * JITTER;
          var amp = Math.pow(1 - k / b.steps, 1.4);
          slices.forEach(function (sl, idx) {
            var h = hash(k * 13 + idx * 7 + b.seed);
            var dir = hash(k * 29 + idx * 11 + b.seed) > 0.5 ? 1 : -1;
            var still = hash(k * 5 + idx * 3 + b.seed) < 0.22;
            var off = still ? 0 : dir * (14 + h * 58) * amp;
            tl.set(sl, { x: off, scaleX: 1 + (still ? 0 : h * 0.06 * amp) }, t);
          });
          ghosts.forEach(function (g, idx) {
            var jx = (idx === 0 ? -1 : 1) * (8 + hash(k * 19 + idx * 13 + b.seed) * 16) * amp;
            var jy = (hash(k * 37 + idx * 3 + b.seed) * 2 - 1) * 5 * amp;
            tl.set(g, { x: jx, y: jy, opacity: 0.35 + 0.35 * amp }, t);
          });
          tracks.forEach(function (tr, idx) {
            var y = 60 + hash(k * 17 + idx * 31 + b.seed) * 960;
            var o = (0.08 + hash(k * 23 + idx * 5 + b.seed) * 0.22) * (0.4 + amp * 0.6);
            tl.set(tr, { y: y - parseFloat(tr.style.top), opacity: o }, t);
          });
        }
        var end = b.start + b.steps * JITTER;
        tl.set(slices, { x: 0, scaleX: 1, autoAlpha: 0 }, end);
        tl.set(ghosts, { x: 0, y: 0, autoAlpha: 0 }, end);
        tl.set(tracks, { autoAlpha: 0 }, end);
        tl.set(base, { autoAlpha: 1 }, end);
      });

      /* ════════ Scene 2 · 1.1–2.2 s · « avant » — circular colour flood ════════ */
      var FLOOD_AT = 1.1;
      var FLOOD_DUR = 0.7;
      tl.fromTo(
        $("flood"),
        { clipPath: "circle(0px at 960px 540px)" },
        { clipPath: "circle(1400px at 960px 540px)", duration: FLOOD_DUR, ease: "power3.inOut" },
        FLOOD_AT,
      );
      // glowing rim riding the flood edge (same ease + duration → locked to the radius)
      tl.fromTo($("ring"), { scale: 0, opacity: 1 }, { scale: 1, duration: FLOOD_DUR, ease: "power3.inOut" }, FLOOD_AT);
      tl.to($("ring"), { opacity: 0, duration: 0.3, ease: "power1.in" }, FLOOD_AT + 0.42);
      // the old world falls away behind the flood
      tl.to($("avant-cam"), { scale: 0.9, duration: FLOOD_DUR, ease: "power2.in" }, FLOOD_AT);
      tl.to($("panels"), { filter: "blur(34px) brightness(0.4)", duration: FLOOD_DUR, ease: "power2.in" }, FLOOD_AT);

      // Grid lines draw outward from the centre axes, nearest lines first.
      var gl = $("gridlines");
      var lines = [];
      for (var vx = 0; vx < 1920; vx += 44) {
        var v = document.createElement("div");
        v.className = "f04-bascule-vl";
        v.style.left = vx + "px";
        gl.appendChild(v);
        lines.push([v, "scaleY", Math.abs(vx - 960)]);
      }
      for (var hy = 0; hy < 1080; hy += 44) {
        var hl = document.createElement("div");
        hl.className = "f04-bascule-hl";
        hl.style.top = hy + "px";
        gl.appendChild(hl);
        lines.push([hl, "scaleX", Math.abs(hy - 540)]);
      }
      lines.forEach(function (L) {
        var from = {};
        var to = { duration: 0.8, ease: "power3.out" };
        from[L[1]] = 0;
        to[L[1]] = 1;
        tl.fromTo(L[0], from, to, 1.12 + (L[2] / 960) * 0.34);
      });
      // hand the drawn lines over to the canonical background grid (pixel-identical)
      tl.set($("grid"), { autoAlpha: 1 }, 2.3);
      tl.set(gl, { autoAlpha: 0 }, 2.3);

      // colour arrives with the flood: brand mesh blooms, then drifts and lands canonical at 7.63
      tl.fromTo($("mesh"), { opacity: 0, scale: 0.82, x: 0, y: 0 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 1.08);
      tl.to($("mesh"), { scale: 1.035, x: -26, y: 12, duration: 2.9, ease: "sine.inOut" }, 2.08);
      tl.to($("mesh"), { scale: 1, x: 0, y: 0, duration: 2.65, ease: "sine.inOut" }, 4.98);
      // ambient glow blooms behind the centre (pulse-on-arrival, ≤ 0.45), then breathes
      tl.fromTo($("glow"), { opacity: 0, scale: 0.75 }, { opacity: 0.45, scale: 1.04, duration: 0.6, ease: "power2.out" }, 1.14);
      tl.to($("glow"), { opacity: 0.34, scale: 1, duration: 0.7, ease: "sine.inOut" }, 1.74);

      /* ════════ Scene 3 · 1.84–3.1 s · « Ask-it » — lockup assembles, then rises ════════ */
      // The mark pops at 120 px on the frame centre; the whole lockup then slides left as
      // the wordmark is pulled out from behind its mask (they never cross).
      var LOCK_SHIFT = 244.7; // lockup x-offset that puts the mark's centre on x = 960
      tl.fromTo($("lockup"), { x: LOCK_SHIFT }, { x: 0, duration: 0.52, ease: "expo.inOut" }, 2.0);
      tl.fromTo($("mark"), { scale: 120 / 86 }, { scale: 1, duration: 0.52, ease: "expo.inOut" }, 2.0);
      tl.fromTo(
        $("mark-pop"),
        { scale: 0, rotation: -14, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.42, ease: "back.out(1.6)" },
        1.84,
      );
      tl.fromTo($("bar1"), { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.24, ease: "power3.out" }, 1.96);
      tl.fromTo($("bar2"), { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.22, ease: "power3.out" }, 2.02);
      tl.fromTo($("dot"), { scale: 0 }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2.2)" }, 2.08);
      tl.fromTo(
        $("word"),
        { clipPath: "inset(-20px 100% -20px 0px)" },
        { clipPath: "inset(-20px 0% -20px 0px)", duration: 0.55, ease: "expo.inOut" },
        2.02,
      );
      tl.fromTo($("word-inner"), { x: -30 }, { x: 0, duration: 0.6, ease: "expo.out" }, 2.06);
      $$("#" + ID + "-word-inner .f04-bascule-ch").forEach(function (ch, k) {
        tl.fromTo(ch, { color: "#d6cfc7" }, { color: "#241f20", duration: 0.26, ease: "power1.out" }, 2.1 + k * 0.035);
      });
      // « transforme » — the lockup rises to y 230 and settles at 0.7; the glow follows it
      tl.to($("lockup"), { y: -310, scale: 0.7, transformOrigin: "0px 0px", duration: 0.56, ease: "power3.inOut" }, 2.54);
      tl.to($("glow"), { y: -310, scale: 0.72, opacity: 0.26, duration: 0.56, ease: "power3.inOut" }, 2.54);

      // a slow camera drift keeps the Ask-it world breathing until the step pills take over
      tl.fromTo($("drift"), { scale: 1 }, { scale: 1.025, duration: 3.86, ease: "sine.inOut" }, 2.0);

      /* ════════ Scene 4 · 3.1–5.9 s · anonymous visitor → client → data ════════ */
      tl.fromTo($("group"), { scale: 1 }, { scale: 1.07, duration: 2.8, ease: "sine.inOut" }, 3.06);
      tl.fromTo($("avatar"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" }, 3.12);
      tl.fromTo(
        $("dashring"),
        { scale: 0.7, opacity: 0, rotation: -40 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "power3.out" },
        3.18,
      );
      tl.to($("dashring"), { rotation: 70, duration: 1.3, ease: "none" }, 3.78);
      // two "who is she?" sonar pings
      $$("#" + ID + "-visitor .f04-bascule-ripple").forEach(function (r, k) {
        tl.fromTo(r, { scale: 1, opacity: 0.55 }, { scale: 1.75, opacity: 0, duration: 0.7, ease: "power2.out" }, 3.5 + k * 0.42);
      });
      tl.fromTo(
        $("tag-anon"),
        { y: 18, opacity: 0, filter: "blur(6px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" },
        3.26,
      );

      // « clients » — card-morph-anchor: the anonymous circle becomes Claire.
      var MORPH_AT = 4.4;
      var MORPH_DUR = 0.6;
      tl.to(
        $("avatar"),
        {
          scale: 1.1,
          backgroundColor: "#ffffff",
          boxShadow: "0px 0px 0px 6px rgba(255,255,255,1), 0px 26px 50px -18px rgba(36,31,32,0.32)",
          duration: MORPH_DUR,
          ease: "power2.inOut",
        },
        MORPH_AT,
      );
      tl.to(document.querySelector("#" + ID + "-avatar .f04-bascule-silhouette"), { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" }, MORPH_AT);
      tl.fromTo(
        document.querySelector("#" + ID + "-avatar .f04-bascule-photo"),
        { opacity: 0, scale: 1.12 },
        { opacity: 1, scale: 1, duration: MORPH_DUR * 0.55, ease: "power2.out" },
        MORPH_AT + MORPH_DUR * 0.45,
      );
      tl.to($("dashring"), { opacity: 0, scale: 1.18, duration: 0.3, ease: "power2.in" }, MORPH_AT);
      tl.fromTo($("halo"), { opacity: 0, scale: 0.7 }, { opacity: 0.32, scale: 1, duration: 0.8, ease: "power2.out" }, MORPH_AT + 0.2);
      // tag swap: « Visiteuse anonyme » rolls out, « Claire » rolls in
      tl.to($("tag-anon"), { y: -14, opacity: 0, filter: "blur(4px)", duration: 0.22, ease: "power2.in" }, MORPH_AT + 0.04);
      tl.fromTo($("tag-name"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, MORPH_AT + 0.22);
      // green « Cliente » badge pops off the ring
      tl.fromTo($("badge"), { scale: 0, opacity: 0, x: -14 }, { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.7)" }, MORPH_AT + 0.42);

      // « data » — four answer chips spring out of her into a 2×2 cluster.
      var FROM_X = 560;
      var FROM_Y = 520;
      [
        ["chip-1", 740, 148, 486],
        ["chip-2", 906, 206, 486],
        ["chip-3", 790, 200, 556],
        ["chip-4", 1008, 300, 556],
      ].forEach(function (cd, k) {
        var el = $(cd[0]);
        var at = 5.24 + k * 0.07;
        tl.fromTo(el, { x: FROM_X - (cd[1] + cd[2] / 2), y: FROM_Y - cd[3] }, { x: 0, y: 0, duration: 0.55, ease: "expo.out" }, at);
        tl.fromTo(el, { scale: 0.2 }, { scale: 1, duration: 0.5, ease: "back.out(1.5)" }, at);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, at);
      });

      /* ════════ Scene 5 · 5.86–7.63 s · « en trois étapes » — PILLS_ROW ════════ */
      tl.to($("scene"), { scale: 0.9, opacity: 0, filter: "blur(8px)", duration: 0.32, ease: "power2.in" }, 5.86);
      tl.set($("scene"), { autoAlpha: 0, filter: "none" }, 6.2);
      [1, 2, 3].forEach(function (n, k) {
        var at = 5.96 + k * 0.08;
        var pill = $("pill-" + n);
        tl.fromTo(pill, { scale: 0.3, y: 40 }, { scale: 1, y: 0, duration: 0.52, ease: "back.out(1.6)" }, at);
        tl.fromTo(pill, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, at);
        tl.set(pill, { filter: "none" }, at + 0.3);
        tl.fromTo(pill.querySelector(".f04-bascule-pill-num"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.1);
        tl.fromTo(
          pill.querySelector(".f04-bascule-pill-label"),
          { x: -16, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
          at + 0.12,
        );
      });
      // hold on PILLS_ROW with a slow drift that lands exactly on the canonical layout at 7.63
      tl.fromTo($("pills-drift"), { scale: 0.98 }, { scale: 1, duration: 1.77, ease: "none" }, 5.86);

      window.__timelines[ID] = tl;
    })();
  </script>
