        </div>
        <div class="f04-bascule-slot" style="left: 960px">
          <div id="f04-bascule-pill-2" class="f04-bascule-pill"><span class="f04-bascule-pill-num">02</span><span class="f04-bascule-pill-label">Recommandation</span></div>
        </div>
        <div class="f04-bascule-slot" style="left: 1400px">
          <div id="f04-bascule-pill-3" class="f04-bascule-pill"><span class="f04-bascule-pill-num">03</span><span class="f04-bascule-pill-label">Dashboard</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "f04-bascule";
      var $ = function (id) {
        return document.getElementById(ID + "-" + id);
      };
      var tl = gsap.timeline({ paused: true });

      // Deterministic hash — every glitch value is a pure function of (step, index).
      var hash = function (n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      /* ════════ Scene 1 · 0.0–1.1 s · « Bon… ça, c'était » — rewind glitch ════════ */
      // Build the slice bands: full copies of the blurred panels, each clipped to one band.
      var base = $("avant-base");
      var slicesWrap = $("slices");
      var SLICES = 8;
      var slices = [];
      for (var i = 0; i < SLICES; i++) {
        var s = document.createElement("div");
        s.className = "f04-bascule-avant-layer f04-bascule-slice";
        var top = (i * 100) / SLICES;
        var bottom = 100 - ((i + 1) * 100) / SLICES;
        s.style.clipPath = "inset(" + top.toFixed(3) + "% -10% " + bottom.toFixed(3) + "% -10%)";
        s.appendChild(base.firstElementChild.cloneNode(true));
        if (i === 2 || i === 6) {
          var tint = document.createElement("div");
          tint.className = "f04-bascule-slice-tint";
          tint.style.background = i === 2 ? "rgba(172,204,233,0.10)" : "rgba(248,87,31,0.07)";
          s.appendChild(tint);
        }
        slicesWrap.appendChild(s);
        slices.push(s);
      }
      var scrubs = Array.prototype.slice.call(document.querySelectorAll("#" + ID + "-avant .f04-bascule-scrub"));
      var tracks = Array.prototype.slice.call(document.querySelectorAll("#" + ID + "-avant .f04-bascule-track"));

      // The f03 camera push (scale 1.08) rewinds while the tape scrubs.
      tl.fromTo($("avant-cam"), { scale: 1.08 }, { scale: 1.0, duration: 0.9, ease: "power2.inOut" }, 0.1);

      // Panel scrub: x −40 then +60, twice (stepped = tape, not jelly), then settle.
      var scrubMoves = [
        [0.12, -40, 0.08, "steps(3)"],
        [0.27, 60, 0.1, "steps(4)"],
        [0.56, -40, 0.08, "steps(3)"],
        [0.71, 60, 0.1, "steps(4)"],
        [0.88, 0, 0.16, "power3.out"],
      ];
      scrubMoves.forEach(function (m, k) {
        if (k === 0) {
          tl.fromTo(scrubs, { x: 0 }, { x: m[1], duration: m[2], ease: m[3] }, m[0]);
        } else {
          tl.to(scrubs, { x: m[1], duration: m[2], ease: m[3] }, m[0]);
        }
      });

      // Two slice bursts — horizontal bands tear on a quantized hash, amplitude decaying.
      var JITTER = 1 / 15;
      var bursts = [
        { start: 0.12, steps: 6, seed: 3 },
        { start: 0.56, steps: 6, seed: 17 },
      ];
      bursts.forEach(function (b) {
        tl.set(base, { autoAlpha: 0 }, b.start);
        tl.set(slices, { autoAlpha: 1 }, b.start);
        tl.set(tracks, { autoAlpha: 1 }, b.start);
        for (var k = 0; k < b.steps; k++) {
          var t = b.start + k * JITTER;
          var amp = Math.pow(1 - k / b.steps, 1.4);
          slices.forEach(function (sl, idx) {
            var h = hash(k * 13 + idx * 7 + b.seed);
            var dir = hash(k * 29 + idx * 11 + b.seed) > 0.5 ? 1 : -1;
            var still = hash(k * 5 + idx * 3 + b.seed) < 0.22;
            var off = still ? 0 : dir * (14 + h * 58) * amp;
            tl.set(sl, { x: off, scaleX: 1 + (still ? 0 : h * 0.06 * amp) }, t);
          });
          tracks.forEach(function (tr, idx) {
            var y = 60 + hash(k * 17 + idx * 31 + b.seed) * 960;
            var o = (0.08 + hash(k * 23 + idx * 5 + b.seed) * 0.22) * (0.4 + amp * 0.6);
            tl.set(tr, { y: y - parseFloat(tr.style.top), opacity: o }, t);
          });
        }
        var end = b.start + b.steps * JITTER;
        tl.set(slices, { x: 0, scaleX: 1, autoAlpha: 0 }, end);
        tl.set(tracks, { autoAlpha: 0 }, end);
        tl.set(base, { autoAlpha: 1 }, end);
      });

      /* ════════ Scene 2 · 1.1–2.1 s · « avant » — circular colour flood ════════ */
      var FLOOD_AT = 1.1;
      var FLOOD_DUR = 0.7;
      tl.fromTo(
        $("flood"),
        { clipPath: "circle(0px at 960px 540px)" },
        { clipPath: "circle(1400px at 960px 540px)", duration: FLOOD_DUR, ease: "power3.inOut" },
        FLOOD_AT,
      );
      // Glowing rim riding the flood edge (same ease + duration → locked to the radius).
      tl.fromTo($("ring"), { scale: 0, opacity: 1 }, { scale: 1, duration: FLOOD_DUR, ease: "power3.inOut" }, FLOOD_AT);
      tl.to($("ring"), { opacity: 0, duration: 0.3, ease: "power1.in" }, FLOOD_AT + 0.4);
      // The old world falls away behind the flood.
      tl.to($("avant-cam"), { scale: 0.9, duration: FLOOD_DUR, ease: "power2.in" }, FLOOD_AT);
      tl.to(
        base.firstElementChild.firstElementChild,
        { filter: "blur(34px) brightness(0.4)", duration: FLOOD_DUR, ease: "power2.in" },
        FLOOD_AT,
      );
      // Grid lines draw outward from the centre axes.
      tl.fromTo($("vlines"), { scaleY: 0 }, { scaleY: 1, duration: 0.95, ease: "power3.out" }, 1.15);
      tl.fromTo($("hlines"), { scaleX: 0 }, { scaleX: 1, duration: 0.95, ease: "power3.out" }, 1.19);
      // Brand mesh blooms in, then drifts and lands exactly on its canonical state at the seam.
      tl.fromTo($("mesh"), { opacity: 0, scale: 0.84, x: 0, y: 0 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 1.25);
      tl.to($("mesh"), { scale: 1.035, x: -26, y: 12, duration: 2.6, ease: "sine.inOut" }, 2.45);
      tl.to($("mesh"), { scale: 1, x: 0, y: 0, duration: 2.58, ease: "sine.inOut" }, 5.05);

      /* ════════ Scene 3 · 1.85–3.1 s · « Ask-it » — lockup assembles, then rises ════════ */
      // ambient glow behind the lockup lands with the logo (≤ 0.45 peak)
      tl.fromTo($("glow"), { opacity: 0, scale: 0.8 }, { opacity: 0.34, scale: 1, duration: 0.9, ease: "power2.out" }, 1.55);
      tl.to($("glow"), { opacity: 0.4, scale: 1.03, duration: 1.5, ease: "sine.inOut" }, 2.45);
      tl.to($("glow"), { opacity: 0.32, scale: 1, duration: 1.6, ease: "sine.inOut" }, 3.95);

      // Mark: pops at 120 px on the centre, then slides into its lockup slot (86 px).
      var MARK_SLOT_CX = -287.7 + 43; // mark centre in the lockup
      var MARK_SLOT_CY = -46 + 43;
      var POP_SCALE = 120 / 86;
      tl.fromTo(
        $("mark"),
        { x: -MARK_SLOT_CX, y: -MARK_SLOT_CY, scale: 0, rotation: -14, opacity: 0 },
        { scale: POP_SCALE, rotation: 0, opacity: 1, duration: 0.42, ease: "back.out(1.6)" },
        1.86,
      );
      tl.fromTo($("bar1"), { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.24, ease: "power3.out" }, 1.97);
      tl.fromTo($("bar2"), { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.22, ease: "power3.out" }, 2.03);
      tl.fromTo($("dot"), { scale: 0 }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2.2)" }, 2.09);
      tl.to($("mark"), { x: 0, y: 0, scale: 1, duration: 0.46, ease: "expo.inOut" }, 2.02);
      // Wordmark: mask reveal behind the travelling mark + slide from x −30, letters pale → ink.
      tl.fromTo(
        $("word"),
        { clipPath: "inset(-20px 100% -20px -40px)" },
        { clipPath: "inset(-20px 0% -20px -40px)", duration: 0.5, ease: "expo.out" },
        2.12,
      );
      tl.fromTo($("word-inner"), { x: -30 }, { x: 0, duration: 0.55, ease: "expo.out" }, 2.12);
      var chars = Array.prototype.slice.call(document.querySelectorAll("#" + ID + "-word-inner .f04-bascule-ch"));
      chars.forEach(function (c, k) {
        tl.fromTo(c, { color: "#d6cfc7" }, { color: "#241f20", duration: 0.28, ease: "power1.out" }, 2.14 + k * 0.035);
      });
      // « transforme » — the lockup rises to y 230 and settles at 0.7.
      tl.fromTo(
        $("lockup"),
        { y: 0, scale: 1 },
        { y: -310, scale: 0.7, transformOrigin: "0px 0px", duration: 0.55, ease: "power3.inOut" },
        2.54,
      );

      // A slow camera drift keeps the Ask-it world breathing until the step pills take over.
      tl.fromTo($("drift"), { scale: 1 }, { scale: 1.025, duration: 3.9, ease: "sine.inOut" }, 2.0);

      /* ════════ Scene 4 · 3.1–5.9 s · visitor → client → data ════════ */
      tl.fromTo($("avatar"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" }, 3.12);
      tl.fromTo($("dashring"), { scale: 0.7, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "power3.out" }, 3.18);
      tl.to($("dashring"), { rotation: 70, duration: 1.3, ease: "none" }, 3.78);
      tl.fromTo(
        $("tag-anon"),
        { y: 18, opacity: 0, filter: "blur(6px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" },
        3.26,
      );

      // « clients » — card-morph-anchor: the anonymous circle becomes Claire.
      var MORPH_AT = 4.4;
      var MORPH_DUR = 0.6;
      tl.to(
        $("avatar"),
        {
          scale: 1.1,
          backgroundColor: "#ffffff",
          boxShadow: "0px 0px 0px 6px rgba(255,255,255,1), 0px 26px 50px -18px rgba(36,31,32,0.32)",
          duration: MORPH_DUR,
          ease: "power2.inOut",
        },
        MORPH_AT,
      );
      tl.to(document.querySelector("#" + ID + "-avatar .f04-bascule-silhouette"), { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" }, MORPH_AT);
      tl.fromTo(
        document.querySelector("#" + ID + "-avatar .f04-bascule-photo"),
        { opacity: 0, scale: 1.12 },
        { opacity: 1, scale: 1, duration: MORPH_DUR * 0.55, ease: "power2.out" },
        MORPH_AT + MORPH_DUR * 0.45,
      );
      tl.to($("dashring"), { opacity: 0, scale: 1.18, duration: 0.3, ease: "power2.in" }, MORPH_AT);
      // tag swap: « Visiteuse anonyme » rolls out, « Claire » rolls in
      tl.to($("tag-anon"), { y: -14, opacity: 0, filter: "blur(4px)", duration: 0.22, ease: "power2.in" }, MORPH_AT + 0.04);
      tl.fromTo($("tag-name"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, MORPH_AT + 0.22);
      // green « Cliente » badge pops off the ring
      tl.fromTo(
        $("badge"),
        { scale: 0, opacity: 0, x: -14 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.7)" },
        MORPH_AT + 0.42,
      );

      // « data » — four answer chips spring out of her into a 2×2 cluster.
      var CHIP_FROM = { x: 560, y: 500 };
      var chipDefs = [
        ["chip-1", 724, 148, 466],
        ["chip-2", 886, 206, 466],
        ["chip-3", 764, 200, 536],
        ["chip-4", 978, 300, 536],
      ];
      chipDefs.forEach(function (c, k) {
        var el = $(c[0]);
        var cx = c[1] + c[2] / 2;
        var at = 5.24 + k * 0.07;
        tl.fromTo(
          el,
          { x: CHIP_FROM.x - cx, y: CHIP_FROM.y - c[3] },
          { x: 0, y: 0, duration: 0.55, ease: "expo.out" },
          at,
        );
        tl.fromTo(el, { scale: 0.2 }, { scale: 1, duration: 0.5, ease: "back.out(1.5)" }, at);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, at);
      });

      /* ════════ Scene 5 · 5.86–7.63 s · « en trois étapes » — PILLS_ROW ════════ */
      tl.to(
        $("scene"),
        { scale: 0.9, opacity: 0, filter: "blur(8px)", duration: 0.32, ease: "power2.in" },
        5.86,
      );
      tl.set($("scene"), { autoAlpha: 0, filter: "none" }, 6.2);

      [1, 2, 3].forEach(function (n, k) {
        var at = 5.96 + k * 0.08;
        var pill = $("pill-" + n);
        tl.fromTo(pill, { scale: 0.3, y: 40 }, { scale: 1, y: 0, duration: 0.52, ease: "back.out(1.6)" }, at);
        tl.fromTo(pill, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, at);
        tl.set(pill, { filter: "none" }, at + 0.3);
        var num = pill.querySelector(".f04-bascule-pill-num");
        var label = pill.querySelector(".f04-bascule-pill-label");
        tl.fromTo(num, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.1);
        tl.fromTo(label, { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, at + 0.12);
      });
      // Hold on PILLS_ROW with a slow drift that lands exactly on the canonical layout at 7.63.
      tl.fromTo($("pills-drift"), { scale: 0.98 }, { scale: 1, duration: 1.77, ease: "none" }, 5.86);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
