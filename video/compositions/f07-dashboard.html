  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const P = 'f07-dashboard-';
      const $ = (id) => document.getElementById(P + id);
      const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = P + cls; if (txt !== undefined) e.textContent = txt; return e; };

      // ---- build-time setup (synchronous, deterministic) ----
      // fixed-width digit slots (DM Sans ships proportional digits, no tnum)
      const makeCounter = (el, finalStr) => {
        const slots = [];
        for (const ch of finalStr) {
          if (/\d/.test(ch)) { const s = mk('span', 'sd'); slots.push(s); el.appendChild(s); } else { el.appendChild(mk('span', 'ss', ' ')); }
        }
        return (v) => {
          const d = String(Math.round(v));
          for (let i = 0; i < slots.length; i++) { const k = d.length - slots.length + i; slots[i].textContent = k >= 0 ? d[k] : ''; }
        };
      };
      const revSet = makeCounter($('revdig'), '78 343');
      const funSet = [['n1', '11 395'], ['n2', '10 617'], ['n3', '9 705'], ['n4', '1 347']].map(([id, f]) => makeCounter($(id), f));
      const FUN = [11395, 10617, 9705, 1347];
      const revS = { v: 0 }, funS = FUN.map(() => ({ v: 0 }));
      revSet(0); funSet.forEach((f) => f(0));

      // persona skeleton rows (shown while the panel "loads")
      [0, 1, 2].forEach((i) => {
        const r = mk('div', 'row');
        r.appendChild(Object.assign(mk('div', 'sk'), { style: 'width:36px;height:36px;border-radius:50%;flex:none' }));
        r.appendChild(Object.assign(mk('div', 'sk'), { style: 'width:' + [150, 120, 132][i] + 'px;height:14px' }));
        r.appendChild(Object.assign(mk('div', 'sk'), { style: 'margin-left:auto;width:180px;height:10px' }));
        $('skel').appendChild(r);
      });

      // Excel grid labels + a few cells
      'ABCDEFGHI'.split('').forEach((c, i) => { const h = mk('div', 'xh', c); h.style.cssText = 'left:' + (44 + i * 96) + 'px;top:5px;width:96px'; $('xlcols').appendChild(h); });
      for (let r = 1; r <= 14; r++) { const h = mk('div', 'xh', String(r)); h.style.cssText = 'left:0;top:' + (6 + (r - 1) * 30) + 'px;width:44px'; $('xlrows').appendChild(h); }
      const XL = [['Date', 'Commande', 'Produit', 'Montant', 'Canal'], ['01/09', '#10482', 'Sérum', '16,90', 'Site'], ['01/09', '#10483', 'Crème', '59,60', 'Site'],
        ['02/09', '#10487', 'Gelée', '10,90', 'Insta'], ['02/09', '#10491', 'Gommage', '14,90', '?'], ['03/09', '#10494', 'Sérum', '#N/A', 'Site'],
        ['04/09', '#10502', 'Crème', '72,50', 'Site'], ['04/09', '#10503', '', '16,90', ''], ['05/09', '#10510', 'Gelée', '10,90', 'Mail']];
      XL.forEach((row, r) => row.forEach((t, c) => {
        if (!t) return;
        const e = mk('div', 'xc', t);
        e.style.cssText = 'left:' + (44 + c * 96) + 'px;top:' + (28 + r * 30) + 'px;' + (r === 0 ? 'font-weight:700;' : '') + (c === 3 && r > 0 ? 'text-align:right;' : '') + (t === '#N/A' ? 'color:#C0392B;' : '');
        $('xlgrid').appendChild(e);
      }));

      // Aski message, split into characters for the streamed reply
      const MSG = 'Lancez une campagne Meta sur l’audience Teint terne · 30–44 ans';
      const chars = MSG.split('').map((ch) => { const s = mk('span', '', ch); $('msg').appendChild(s); return s; });

      // svg-path-draw setup: measured lengths
      const line = $('line'), link = $('linkp');
      const lineLen = line.getTotalLength(), linkLen = link.getTotalLength();
      gsap.set(line, { strokeDasharray: lineLen, strokeDashoffset: lineLen });
      gsap.set(link, { strokeDasharray: linkLen, strokeDashoffset: linkLen });

      // camera: single state, single writer
      const world = $('world');
      const AX = 960, AY = 500;
      const cam = { fx: 960, fy: 500, s: 1, blur: 0 };
      const applyCamera = () => {
        world.style.transform = 'translate(' + (AX - cam.s * cam.fx).toFixed(2) + 'px,' + (AY - cam.s * cam.fy).toFixed(2) + 'px) scale(' + cam.s.toFixed(4) + ')';
        world.style.filter = cam.blur > 0.05 ? 'blur(' + cam.blur.toFixed(2) + 'px)' : 'none';
      };
      applyCamera();
      gsap.set($('cursor'), { x: 1720, y: 700, opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      const camLeg = (from, to, at, dur, ease, blurPeak) => {
        tl.fromTo(cam, from, { ...to, duration: dur, ease, immediateRender: false, onUpdate: applyCamera }, at);
        if (blurPeak) {
          tl.fromTo(cam, { blur: 0 }, { blur: blurPeak, duration: dur / 2, ease: 'power2.in', immediateRender: false, onUpdate: applyCamera }, at);
          tl.fromTo(cam, { blur: blurPeak }, { blur: 0, duration: dur / 2, ease: 'power2.out', immediateRender: false, onUpdate: applyCamera }, at + dur / 2);
        }
      };

      tl.fromTo($('mesh'), { x: -40, y: 10, scale: 1 }, { x: 40, y: -10, scale: 1.06, duration: 11.23, ease: 'sine.inOut' }, 0);

      // ---- Scene 1 (0–1.9): the dashboard window rises in, the app wakes up ----
      tl.fromTo($('win'), { y: 160, rotationX: 22, transformPerspective: 1400, opacity: 0, filter: 'blur(10px)' }, { y: 0, rotationX: 0, opacity: 1, filter: 'blur(0px)', duration: 0.95, ease: 'expo.out' }, 0.02);
      tl.fromTo($('pill'), { y: -44, opacity: 0, filter: 'blur(8px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.45, ease: 'expo.out' }, 0.72);
      tl.fromTo($('pillnum'), { scale: 0.4, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: 'back.out(1.6)' }, 0.8);
      gsap.utils.toArray('#' + P + 'menu > div').forEach((el, i) => {
        tl.fromTo(el, { x: -18, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: 'expo.out' }, 0.32 + i * 0.04);
      });
      tl.fromTo([$('title'), $('sub')], { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'expo.out', stagger: 0.05 }, 0.42);
      [$('rev'), $('per'), $('fun'), $('askcard')].forEach((el, i) => {
        tl.fromTo(el, { y: 22, scale: 0.97, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.5 + i * 0.06);
      });
      camLeg({ fx: 960, fy: 500, s: 1 }, { fx: 930, fy: 492, s: 1.03 }, 1.0, 2.6, 'power1.inOut');

      // ---- Scene 2 (2.0–3.6): « Adieu le tableau Excel » — slam in, crumple away ----
      tl.fromTo($('xl'), { scale: 1.15, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: 'power3.out' }, 1.82);
