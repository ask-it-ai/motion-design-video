  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const P = 'f06-recommandation-';
      const $ = (id) => document.getElementById(P + id);
      const SVGNS = 'http://www.w3.org/2000/svg';

      // ---- build-time setup (deterministic, synchronous) ----
      // total pill counter: fixed-width digit slots for "72,50 €" (DM Sans ships proportional digits)
      const totNum = $('totnum');
      const totSlots = [];
      ['d', 'd', 's', 'd', 'd'].forEach((k) => {
        const s = document.createElement('span');
        s.className = P + (k === 'd' ? 'sd' : 'ss');
        if (k === 's') s.textContent = ',';
        totNum.appendChild(s);
        if (k === 'd') totSlots.push(s);
      });
      const euro = document.createElement('span');
      euro.textContent = ' €';
      totNum.appendChild(euro);
      const renderTotal = (v) => {
        const cents = Math.round(v * 100);
        const s = String(Math.floor(cents / 100)).padStart(2, ' ') + String(cents % 100).padStart(2, '0');
        for (let i = 0; i < 4; i++) totSlots[i].textContent = s[i] === ' ' ? '' : s[i];
      };
      renderTotal(0);

      // impact lines (thin radial strokes) around each stat
      const buildLines = (svg, rx, ry) => {
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2 + 0.26;
          const c = Math.cos(a), s = Math.sin(a);
          const l = document.createElementNS(SVGNS, 'line');
          l.setAttribute('x1', (500 + c * rx).toFixed(1));
          l.setAttribute('y1', (280 + s * ry).toFixed(1));
          l.setAttribute('x2', (500 + c * (rx + 46)).toFixed(1));
          l.setAttribute('y2', (280 + s * (ry + 30)).toFixed(1));
          svg.appendChild(l);
        }
      };
      buildLines($('sa-lines'), 210, 150);
      buildLines($('sb-lines'), 380, 160);

      const digA = $('sa-d'), digB1 = $('sb-d1'), digB2 = $('sb-d2');
      const stA = { v: 1 }, stB = { v: 0 }, stT = { v: 0 };
      const renderA = () => { digA.textContent = String(Math.round(stA.v)); };
      const renderB = () => {
        const n = Math.round(stB.v);
        digB1.textContent = n >= 10 ? String(Math.floor(n / 10)) : String(n);
        digB2.textContent = n >= 10 ? String(n % 10) : '';
      };

      // intentional layering: the fanned cards overlap, and the whole group turns into a blurred backdrop under the stats
      const flag = (el, attr) => el.querySelectorAll('*').forEach((n) => n.setAttribute(attr, ''));
      flag($('group'), 'data-layout-allow-occlusion');
      flag($('group'), 'data-layout-allow-overlap');
      flag($('stats'), 'data-layout-allow-overlap');
      flag($('profile'), 'data-layout-allow-occlusion');
      gsap.set([$('phone1'), $('phone2')], { scale: 0.9 });
      gsap.set($('phone2'), { rotationY: -8 });
      gsap.set([$('sa-lines'), $('sb-lines')], { transformOrigin: '50% 50%' });

      const tl = gsap.timeline({ paused: true });

      // ---- ambient: brand mesh drift + slow camera drift (never a frozen frame) ----
      tl.fromTo($('mesh'), { x: 0, y: 0, scale: 1 }, { x: 46, y: -14, scale: 1.06, duration: 12.36, ease: 'sine.inOut' }, 0);
      tl.fromTo($('cam'), { scale: 1 }, { scale: 1.02, duration: 6.9, ease: 'none' }, 0);

      // ---- Scene 1 (0–1.9): profile handed to the page, step pill, scroll to the routine ----
      tl.to($('profile'), { x: -150, scale: 0.86, opacity: 0, filter: 'blur(10px)', duration: 0.55, ease: 'power2.in' }, 0);
      tl.to($('timer'), { x: -120, y: 30, scale: 0.7, opacity: 0, filter: 'blur(8px)', duration: 0.42, ease: 'power2.in' }, 0);
      tl.fromTo($('ring1'), { scale: 0.96, opacity: 0 }, { scale: 1, opacity: 0.95, duration: 0.06, ease: 'none' }, 0.34);
      tl.to($('ring1'), { scale: 1.75, opacity: 0, duration: 0.6, ease: 'power2.out' }, 0.4);
      tl.fromTo($('ring2'), { scale: 0.96, opacity: 0 }, { scale: 1, opacity: 0.8, duration: 0.06, ease: 'none' }, 0.48);
      tl.to($('ring2'), { scale: 1.45, opacity: 0, duration: 0.55, ease: 'power2.out' }, 0.54);
      tl.fromTo($('pill'), { y: -44, opacity: 0, filter: 'blur(8px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.45, ease: 'expo.out' }, 0.95);
      tl.fromTo($('pillnum'), { scale: 0.4, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: 'back.out(1.6)' }, 1.02);
      tl.to($('pagecontent'), { y: -960, duration: 1.18, ease: 'power2.inOut' }, 0.72);

      // ---- Scene 2 (2.0–3.6): split-tilt — another visitor's page, ≠ ----
      tl.to($('phone1'), { rotationY: 8, duration: 0.72, ease: 'power3.out' }, 1.98);
      tl.fromTo($('phone2'), { x: 1000, rotationY: -22, opacity: 0, filter: 'blur(10px)' }, { x: 0, rotationY: -8, opacity: 1, filter: 'blur(0px)', duration: 0.75, ease: 'power3.out' }, 1.98);
      tl.fromTo($('neq'), { scale: 0, rotation: -35, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: 'back.out(1.6)' }, 2.53);
      tl.to($('phone1'), { y: -7, duration: 0.72, ease: 'sine.inOut' }, 2.7);
      tl.to($('phone2'), { y: 7, duration: 0.72, ease: 'sine.inOut' }, 2.7);
      tl.to($('neq'), { scale: 0.45, opacity: 0, filter: 'blur(6px)', duration: 0.16, ease: 'power2.in' }, 3.42);
      tl.to($('phone2'), { x: 960, rotationY: -28, opacity: 0, filter: 'blur(8px)', duration: 0.32, ease: 'power2.in' }, 3.45);
      tl.to($('phone1'), { rotationY: 0, y: 0, duration: 0.5, ease: 'power3.inOut' }, 3.45);

      // ---- Scene 3 (3.6–6.3): routine cards fly out of the page, total counts, reassurance ----
      const cards = [
        { el: $('c1'), ox: -484, oy: -238, r: -5 },
        { el: $('c2'), ox: -694, oy: 9, r: -1.6 },
        { el: $('c3'), ox: -904, oy: 223, r: 1.6 },
        { el: $('c4'), ox: -1114, oy: 470, r: 5 },
      ];
      cards.forEach((c, i) => {
        const at = 3.62 + i * 0.08;
        tl.fromTo(c.el, { x: c.ox, y: c.oy, scale: 0.3, rotation: 0, filter: 'blur(8px)' },
          { x: 0, y: 0, scale: 1, rotation: c.r, filter: 'blur(0px)', duration: 0.62, ease: 'expo.out' }, at);
        tl.fromTo(c.el.firstElementChild, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: 'power1.out' }, at);
      });
      tl.fromTo($('total'), { y: 26, scale: 0.85, opacity: 0, filter: 'blur(8px)' }, { y: 0, scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.45, ease: 'expo.out' }, 3.98);
      tl.to(stT, { v: 72.5, duration: 1.0, ease: 'power2.out', onUpdate: () => renderTotal(stT.v) }, 4.05);
      tl.fromTo(totNum, { scale: 0.72 }, { scale: 1, duration: 1.0, ease: 'power2.out' }, 4.05);
      [['b1', 5.15], ['b2', 5.38], ['b3', 5.62]].forEach(([id, at]) => {
        tl.fromTo($(id), { y: 18, scale: 0.6, opacity: 0, filter: 'blur(8px)' }, { y: 0, scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.45, ease: 'expo.out' }, at);
      });
      tl.fromTo($('seal'), { scale: 1.9, rotation: 24, opacity: 0 }, { scale: 1, rotation: 9, opacity: 1, duration: 0.36, ease: 'back.out(1.8)' }, 5.86);

      // ---- Scene 4 (7.0–12.36): video-text pivot — the page yields, ×4 and +36 % land ----
      tl.to($('group'), { x: -300, y: 12, scale: 0.8, opacity: 0.42, filter: 'blur(8px)', duration: 0.62, ease: 'power3.inOut' }, 6.9);
      tl.fromTo($('veil'), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 6.95);
      tl.fromTo($('stats'), { scale: 1 }, { scale: 1.03, duration: 4.96, ease: 'none' }, 7.4);

      // ×4 — number slam, impact lines, count 1 → 4
      tl.fromTo($('sa'), { yPercent: -120, opacity: 0, filter: 'blur(12px)' }, { yPercent: 0, opacity: 1, filter: 'blur(0px)', duration: 0.08, ease: 'power4.in' }, 7.4);
      tl.fromTo($('sa-num'), { scaleX: 1.1, scaleY: 0.86 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: 'back.out(2)' }, 7.48);
      tl.fromTo($('sa-lines'), { scale: 1, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.25, ease: 'power2.out' }, 7.48);
      tl.to(stA, { v: 4, duration: 0.46, ease: 'power2.out', onUpdate: renderA }, 7.49);
      tl.fromTo(digA, { scale: 0.62 }, { scale: 1, duration: 0.46, ease: 'power2.out' }, 7.49);
      tl.fromTo($('sa-label'), { y: 24, opacity: 0, filter: 'blur(8px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'expo.out' }, 8.3);
      tl.to($('sa'), { x: -400, duration: 0.5, ease: 'power3.inOut' }, 9.45);

      // +36 % — number slam, impact lines, count 0 → 36, % lands after the count
      tl.fromTo($('sb'), { yPercent: -120, opacity: 0, filter: 'blur(12px)' }, { yPercent: 0, opacity: 1, filter: 'blur(0px)', duration: 0.08, ease: 'power4.in' }, 9.82);
      tl.fromTo($('sb-num'), { scaleX: 1.1, scaleY: 0.86 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: 'back.out(2)' }, 9.9);
      tl.fromTo($('sb-lines'), { scale: 1, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.25, ease: 'power2.out' }, 9.9);
      tl.to(stB, { v: 36, duration: 1.12, ease: 'power3.out', onUpdate: renderB }, 9.9);
      tl.fromTo([digB1, digB2], { scale: 0.55 }, { scale: 1, duration: 1.12, ease: 'power3.out' }, 9.9);
      tl.fromTo($('pct'), { y: 40, scale: 0.4, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(1.6)' }, 10.98);
      tl.fromTo($('sb-label'), { y: 24, opacity: 0, filter: 'blur(8px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'expo.out' }, 11.18);

      window.__timelines = window.__timelines || {};
      window.__timelines['f06-recommandation'] = tl;
    })();
  </script>
