  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <script>
    (function () {
      var ID = "f11-insights", DUR = 4.30;
      var MK = window.MK, F = MK.F;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var tl = gsap.timeline({ paused: true });

      var stage = $("stage"), shake = $("shake"), tilt = $("tilt"), rig = $("rig"), drift = $("drift");
      var scroll = $("scroll"), panel = $("panel"), fx = $("fx"), rfx = $("rfx"), touch = $("touch");

      /* one directional-blur filter per moving layer */
      var bfScroll = MK.blurFilter(stage, ID + "-blur-scroll");
      var bfRig = MK.blurFilter(stage, ID + "-blur-rig");
      var bfPanel = MK.blurFilter(stage, ID + "-blur-panel");

      /* ---------- build-time content (synchronous, deterministic) ---------- */
      // fixed-width digit slots (DM Sans digits are proportional): centred counters do not jiggle
      function makeCounter(el, finalStr) {
        var slots = [];
        Array.from(finalStr).forEach(function (ch) {
          var s = document.createElement("span");
          if (/\d/.test(ch)) { s.className = ID + "-sd"; slots.push(s); } else { s.className = ID + "-ss"; s.textContent = " "; }
          el.appendChild(s);
        });
        return function (v) {
          var d = String(Math.round(v));
          for (var i = 0; i < slots.length; i++) { var k = d.length - slots.length + i; slots[i].textContent = k >= 0 ? d[k] : ""; }
        };
      }
      var FUN = [11395, 10617, 9705, 1347], FUNS = ["11 395", "10 617", "9 705", "1 347"];
      var setters = FUN.map(function (v, i) { return makeCounter($("n" + (i + 1)), FUNS[i]); });
      var MSG = "Lancez une campagne Meta sur l’audience « Teint terne · 30–44 ans »";
      $("ghost").textContent = MSG;

      /* intentional layering for the layout audit: the Aski panel sits over the dashboard */
      [panel, $("scrim")].forEach(function (el) {
        el.setAttribute("data-layout-allow-overlap", ""); el.setAttribute("data-layout-allow-occlusion", "");
        el.querySelectorAll("*").forEach(function (n) { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });
      });

      /* late elements start hidden (set at build and at t=0 so any seek order agrees) */
      var late = [panel, $("scrim"), $("bubble"), $("ston"), $("togon"), $("campok"), touch, $("alert")];
      gsap.set(late, { autoAlpha: 0 });
      tl.set(late, { autoAlpha: 0 }, 0);

      /* ---------- camera life for the whole scene ---------- */
      MK.drift(tl, drift, 0, DUR, { seed: 11 });
      tl.fromTo(tilt, { rotationX: 2.4, rotationY: -2.6, transformPerspective: 2200 }, { rotationX: -1.4, rotationY: 3.4, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo($("mesh"), { x: -30, y: 16, scale: 1 }, { x: 30, y: -18, scale: 1.06, duration: DUR, ease: "none" }, 0);

      /* ---------- Scene 1 (0.00–0.80): ENTRY — the dashboard scroll is launched UP, the personas card brakes ---------- */
      MK.enter(tl, scroll, 0, { dir: "up", dist: 900, frames: 38, blur: bfScroll });
      // share bars: scaleX 0 -> 1.04 -> 1, 4-frame offsets from 0.05
      var fills = Array.prototype.slice.call($("per").getElementsByClassName(ID + "-fill"));
      MK.each(fills, 0.05, 4, function (el, t) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1.04, duration: 12 * F, ease: "power3.out" }, t);
        tl.to(el, { scaleX: 1, duration: 10 * F, ease: "power2.inOut" }, t + 12 * F);
      });
      // camera snaps +10 % toward Claire's row (S-curve)
      MK.snapZoom(tl, rig, 0.12, { from: 1, to: 1.1, origin: "960px 373px" });
      // « personas » (0.19): Claire's row turns coral-tint, ring around her avatar
      tl.fromTo($("hl"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 3 * F, ease: "none" }, 0.19);
      tl.fromTo($("hlbar"), { scaleY: 0 }, { scaleY: 1, duration: 8 * F, ease: "power3.out" }, 0.19);
      MK.ring(tl, rfx, 0.19, { x: 414, y: 373, r0: 56, r1: 120, width: 5, frames: 24 });
      tl.to($("av1"), { scale: 1.1, duration: 5 * F, ease: "power2.out" }, 0.19);
      tl.to($("av1"), { scale: 1, duration: 16 * F, ease: "power2.inOut" }, 0.19 + 5 * F);

      /* ---------- Scene 2 (0.80–2.00): « où votre tunnel bloque » ---------- */
      MK.pan(tl, rig, 0.80, { y: -700, frames: 20, blur: bfRig, axis: "y" });
      var bars = [$("b1"), $("b2"), $("b3"), $("b4")], nums = [$("n1"), $("n2"), $("n3"), $("n4")];
      var RISE = [300, 300, 255.5, 35.5];
      MK.each(bars, 1.00, 4, function (el, t, i) {
        tl.fromTo(el, { scaleY: 0 }, { scaleY: 1.06, duration: 14 * F, ease: "power3.out" }, t);
        tl.to(el, { scaleY: 1, duration: 12 * F, ease: "power2.inOut" }, t + 14 * F);
        tl.fromTo(nums[i], { y: RISE[i], autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 14 * F, ease: "power3.out" }, t);
        MK.count(tl, t, { from: 0, to: FUN[i], dur: 0.42, render: setters[i] });
      });
      // friction alert slammed: impact on « bloque » (1.61)
      var impact = MK.slam(tl, $("alert"), 1.46, { from: 2.2, shakeEl: shake, shakePx: 10 });
      tl.fromTo($("zone"), { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 7 * F, ease: "power3.out" }, impact);
      tl.fromTo($("lead"), { scaleY: 0 }, { scaleY: 1, duration: 6 * F, ease: "power2.out" }, impact + 2 * F);
      var pulses = Array.prototype.slice.call($("adot").children);
      tl.set(pulses, { autoAlpha: 0 }, 0);
      for (var k = 0; k < 7; k++) {
        tl.fromTo(pulses[k % 3], { scale: 1, autoAlpha: 0.95 }, { scale: 3.4, autoAlpha: 0, duration: 0.5, ease: "power1.out", immediateRender: false }, impact + k * 0.32);
      }
      tl.fromTo($("adot"), { scale: 1 }, { scale: 1.35, duration: 4 * F, ease: "power2.out", immediateRender: false }, impact);
      tl.to($("adot"), { scale: 1, duration: 12 * F, ease: "power2.inOut" }, impact + 4 * F);

      /* ---------- Scene 3 (2.06–3.40): « et quelle publicité lancer » ---------- */
      // depth of field: the dashboard goes out of focus 5 frames before the gesture
      tl.fromTo(scroll, { filter: "blur(0px)" }, { filter: "blur(7px)", duration: 14 * F, ease: "power2.out", immediateRender: false }, 2.06 - 5 * F);
      tl.fromTo($("scrim"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 14 * F, ease: "power1.out", immediateRender: false }, 2.06 - 5 * F);
      // the Aski panel is launched in from the right
      tl.set(panel, { autoAlpha: 1 }, 2.06);
      MK.enter(tl, panel, 2.06, { dir: "left", dist: 800, frames: 30, blur: bfPanel });
      // typing dots while the panel brakes, then the reply streams (70 cps from 2.25)
      var dots = Array.prototype.slice.call($("dots").children);
      MK.each(dots, 2.08, 3, function (el, t) {
        tl.fromTo(el, { y: 0 }, { y: -9, duration: 4 * F, ease: "sine.out", immediateRender: false }, t);
        tl.to(el, { y: 0, duration: 4 * F, ease: "sine.in" }, t + 4 * F);
      });
      tl.set($("dots"), { autoAlpha: 0 }, 2.25);
      tl.set($("bubble"), { autoAlpha: 1 }, 2.25);
      tl.fromTo($("bubble"), { scale: 0.92 }, { scale: 1, duration: 10 * F, ease: "back.out(2)", immediateRender: false }, 2.25);
      MK.type(tl, $("typed"), MSG, 2.25, { cps: 70 });
      // campaign card pops at 3.10 (OFF toggle)
      MK.pop(tl, $("camp"), 3.10, { over: 0.16 });

      /* ---------- Scene 4 (3.44–4.00): « ensuite » — the toggle is clicked ---------- */
      var TOG = { x: 1033 + 34 + 545 + 52, y: 735 + 340 + 158 + 29 };   // toggle centre in world px
      // the touch arrives already moving (from below-right) and decelerates onto the toggle
      tl.set(touch, { autoAlpha: 1 }, 3.10);
      tl.fromTo(touch, { x: TOG.x + 300, y: TOG.y + 470 }, { x: TOG.x + 4, y: TOG.y + 6, duration: 17 * F, ease: "power2.out", immediateRender: false }, 3.10);
      tl.to(touch, { x: TOG.x, y: TOG.y, duration: 4 * F, ease: "sine.inOut" }, 3.10 + 17 * F);
      // the snap zoom re-centres on the toggle: keep the frame still at the origin swap (rig is at x1.1)
      var O1 = { x: 960, y: 373 }, S1 = 1.1;
      tl.set(rig, { transformOrigin: TOG.x + "px " + TOG.y + "px", x: (S1 - 1) * (TOG.x - O1.x), y: -700 + (S1 - 1) * (TOG.y - O1.y) }, 3.44);
      MK.click(tl, { t: 3.44, x: TOG.x, y: TOG.y, layer: fx, component: $("campwrap"), shakeEl: shake, touch: touch, rig: rig, snap: 0.15, rigScale: S1,
        dashLen: 40, dashW: 7, r0: 44, r1: 116 });
      MK.ring(tl, fx, 3.44, { x: TOG.x, y: TOG.y, r0: 20, r1: 84, width: 3, color: "rgba(36,31,32,0.45)", alpha: 0.8, frames: 20 });
      // instant state change on the click frame
      tl.set($("togon"), { autoAlpha: 1 }, 3.44);
      tl.set($("knob"), { x: 46 }, 3.44);
      tl.set($("stoff"), { autoAlpha: 0 }, 3.44);
      tl.set($("campok"), { autoAlpha: 1 }, 3.44);
      MK.pop(tl, $("ston"), 3.44, { from: 0.85, over: 0.1 });
      // the touch lifts away after the lock
      tl.to(touch, { x: TOG.x + 170, y: TOG.y + 260, autoAlpha: 0, duration: 20 * F, ease: "power2.in" }, 3.70);

      /* ---------- Scene 5 (4.00–4.30): EXIT — push left, last frame = fastest ---------- */
      MK.exit(tl, rig, 4.00, { dir: "left", dist: 1600, frames: 18, blur: bfRig });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
