  <script>
    (function () {
      var ID = "f06-diagnostic", DUR = 9.25, SEED = 6;
      var MK = window.MK, F = MK.F, CORAL = "#F8571F";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var tl = gsap.timeline({ paused: true });

      var shake = $("shake"), rig = $("rig"), drift = $("drift"), tilt = $("tilt"), cam = $("cam"), zoom = $("zoom");
      var phone = $("phone"), pfx = $("pfx"), fx = $("fx"), touch = $("touch"), mesh = $("mesh");
      var bfRig = MK.blurFilter(root, ID + "-blur-rig"), bfCam = MK.blurFilter(root, ID + "-blur-cam");

      // screenshot px (780 × 1688) → zoom-local px (the phone body sits at x 282, the screen at +28)
      var SX = 310, SY = 28;
      var Z = function (sx, sy) { return [SX + sx, SY + sy]; };
      // drift-space position of a screen point, given the camera translation and the 3D attitude at time t
      // (the point is also the zoom origin when it is used, so the zoom scale never moves it)
      function toDrift(sx, sy, cx, cy, t) {
        var X = SX + sx + cx, Y = SY + sy + cy;
        var p = t / DUR, th = (-6 + 10 * (1 - Math.cos(Math.PI * p)) / 2) * Math.PI / 180;
        var k = 2200 / (2200 + (X - 700) * Math.sin(th));
        return [700 + (X - 700) * Math.cos(th) * k, 540 + (Y - 540) * k];
      }
      // the S-curve of MK.snapZoom as one ease: 7 frames to 5 %, 2 frames to 70 %, tail to 100 %
      function sEase(tail) {
        var tot = 9 + tail;
        return function (p) {
          var f = p * tot;
          if (f <= 7) return 0.05 * (1 - Math.cos((f / 7) * Math.PI / 2));
          if (f <= 9) return 0.05 + 0.65 * (f - 7) / 2;
          return 0.7 + 0.3 * (1 - Math.pow(1 - (f - 9) / tail, 4));
        };
      }
      function snapCam(t, vars) {
        var v = { duration: 25 * F, ease: sEase(16) };
        for (var k in vars) v[k] = vars[k];
        tl.to(cam, v, t);
        bfCam.ramp(tl, cam, t + 5 * F, 2 * F, 0, 16, "y", "power2.in");
        bfCam.ramp(tl, cam, t + 9 * F, 6 * F, 16, 0, "y", "power2.out");
        bfCam.clear(tl, cam, t + 15 * F);
      }
      function swapPage(a, b, t) { tl.set($(b), { autoAlpha: 1 }, t); tl.set($(a), { autoAlpha: 0 }, t); }
      function rippleAt(t) {
        var r = document.createElement("div");

        tl.fromTo(r, { scale: 1, opacity: 0.6 }, { scale: 2.2, opacity: 0, duration: 22 * F, ease: "power2.out", immediateRender: false }, t);

      function flyChip(el, t, from, arc, frames) {

      var pval = $("pval"), pfill = $("pfill"), cardin = $("cardin");

        tl.to(pfill, { scaleX: b / 100, duration: 10 * F, ease: "power2.out" }, t);
        MK.count(tl, t, { from: a, to: b, dur: 10 * F, render: function (v) { pval.textContent = Math.round(v) + " %"; } });

      }
      // skeleton slots take the exact width of the chip that will land on them
      ["1", "2", "3"].forEach(function (n) { $("sk" + n).style.width = $("chip" + n).offsetWidth + "px"; });

      /* ═══ Scene 1 · 0.00–1.90 · ENTRY + « D'abord, le diagnostic » ═══ */
      MK.enterBig(tl, rig, 0, { from: 1.45, frames: 40 });
      MK.drift(tl, drift, 0, DUR, { seed: SEED });

      tl.fromTo(cam, { x: 0, y: -60 }, { y: -280, duration: 1.2, ease: "sine.inOut" }, 0.25);
      // a white shimmer band sweeps diagonally across the screen on « diagnostic »
      var shim = $("shimmer");
      tl.set(shim, { autoAlpha: 1 }, 0.94);
      tl.fromTo(shim, { x: -560, rotation: 20 }, { x: 1060, rotation: 20, duration: 0.46, ease: "power2.inOut" }, 0.94);

      MK.pop(tl, $("bEndroA"), 1.60);

      /* ═══ Scene 2 · 1.94–3.95 · « Intégré à votre site, à votre image »: skin swaps on whip-pan peaks ═══ */

      tl.to(cam, { y: -310, duration: 1.3, ease: "sine.inOut" }, 2.95);

      tl.set($("bEndroB"), { autoAlpha: 0 }, 3.48);
      MK.pop(tl, $("bEndroC"), 3.48, { from: 0.6 });
      MK.ring(tl, fx, 3.48, { x: 1230, y: 102, r1: 170, r0: 60, color: CORAL, width: 5 });

      /* ═══ Scene 3 · 4.24–6.60 · « Il pose à chaque visiteuse les bonnes questions » ═══ */
      [$("cardsh"), $("card")].forEach(function (el) {
        tl.set(el, { autoAlpha: 1 }, 4.24);
        MK.enter(tl, el, 4.24, { dir: "left", dist: 700, frames: 38 });
        tl.fromTo(el, { rotationY: 28, transformPerspective: 1600 }, { rotationY: 0, transformPerspective: 1600, duration: 38 * F, ease: "back.out(1.4)" }, 4.24);
      });
      // the camera snaps down to the first-name field + CTA
      snapCam(4.41, { y: -880 });
      tl.set($("field"), { autoAlpha: 1 }, 4.40);
      MK.type(tl, $("ftext"), "Claire", 4.45, { cps: 30 });
      swapPage("p00", "p01", 4.65);
      tl.set($("field"), { autoAlpha: 0 }, 4.65);
      // the touch comes onto « COMMENCER MON DIAGNOSTIC »
      var cta = Z(390, 1628);
      tl.fromTo(touch, { x: cta[0] + 150, y: cta[1] + 170, scale: 0.7, autoAlpha: 0 }, { x: cta[0], y: cta[1], scale: 1, autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 4.62);
      tl.set(zoom, { transformOrigin: cta[0] + "px " + cta[1] + "px" }, 4.90);
      MK.click(tl, { t: 5.01, x: cta[0], y: cta[1], layer: pfx, component: phone, shakeEl: shake, touch: touch, rig: zoom, snap: 0.12, rigScale: 1 });
      rippleAt(5.01);
      swapPage("p01", "p04", 5.01);
      // the camera snaps back up to frame the question and the three photos
      snapCam(5.20, { y: -298 });
      tl.to(zoom, { scale: 1, duration: 25 * F, ease: sEase(16) }, 5.20);
      // slow travel across the photos while the touch moves to PEAU MIXTE/NORMALE
      tl.to(cam, { x: -80, duration: 0.88, ease: "sine.inOut" }, 5.62);
      var tile = Z(560, 820);
      tl.to(touch, { x: tile[0], y: tile[1], duration: 0.83, ease: "power2.inOut" }, 5.62);

      /* ═══ Scene 4 · 6.82–7.40 · « ses besoins » ═══ */
      tl.set($("tile"), { autoAlpha: 1 }, 6.66);
      tl.set(zoom, { transformOrigin: tile[0] + "px " + tile[1] + "px" }, 6.70);
      MK.click(tl, { t: 6.82, x: tile[0], y: tile[1], layer: pfx, component: $("tilecomp"), shakeEl: shake, touch: touch, rig: zoom, snap: 0.08, rigScale: 1 });
      rippleAt(6.82);
      swapPage("p04", "p04c", 6.82);
      tl.set($("tileBase"), { autoAlpha: 0 }, 6.82);
      tl.set($("tileChoix"), { autoAlpha: 1 }, 6.82);
      tl.set($("tile"), { autoAlpha: 0 }, 7.22);
      var land1 = flyChip($("chip1"), 6.84, toDrift(560, 820, -80, -298, 6.84), -160, 28); // → 7.307
      progress(land1, 0, 33, $("sk1"));

      /* ═══ Scene 5 · 7.43–8.15 · « sa routine » ═══ */
      MK.pan(tl, cam, 7.40, { x: 30, y: -529, frames: 14, blur: bfCam, axis: "y" });
      tl.to(zoom, { scale: 1, duration: 0.2, ease: "power2.inOut" }, 7.40);
      var pkF = 7.40 + 7 * F; // speed peak 7.517
      swapPage("p04c", "p12", pkF);
      var ess = Z(330, 1100);
      tl.to(touch, { x: ess[0], y: ess[1], duration: 0.16, ease: "power2.inOut" }, 7.40);
      tl.set($("opt"), { autoAlpha: 1 }, pkF);
      tl.set(zoom, { transformOrigin: ess[0] + "px " + ess[1] + "px" }, 7.605);
      MK.click(tl, { t: 7.62, x: ess[0], y: ess[1], layer: pfx, component: $("optcomp"), shakeEl: shake, touch: touch, rig: zoom, snap: 0.08, rigScale: 1 });
      rippleAt(7.62);
      swapPage("p12", "p12c", 7.62);
      tl.set($("optBase"), { autoAlpha: 0 }, 7.62);
      tl.set($("optChoix"), { autoAlpha: 1 }, 7.62);
      tl.set($("opt"), { autoAlpha: 0 }, 8.0);
      var land2 = flyChip($("chip2"), 7.623, toDrift(330, 1100, 30, -529, 7.623), -160, 28); // → 8.09
      progress(land2, 33, 66, $("sk2"));

      /* ═══ Scene 6 · 8.20–8.95 · « ses habitudes » ═══ */
      MK.pan(tl, cam, 8.20, { x: -30, y: -688, frames: 12, blur: bfCam, axis: "y" });
      tl.to(zoom, { scale: 1, duration: 0.16, ease: "power2.inOut" }, 8.20);
      var pkG = 8.20 + 6 * F; // speed peak 8.30
      swapPage("p12c", "p05", pkG);
      tl.set($("slider"), { autoAlpha: 1 }, pkG);
      var k0 = Z(40, 1300), k3 = Z(250, 1300), res = Z(620, 1210);
      tl.to(touch, { x: k0[0], y: k0[1], duration: 0.24, ease: "power2.inOut" }, 8.12);
      tl.to(touch, { scale: 0.82, duration: 3 * F, ease: "power2.in" }, 8.36);
      tl.to(touch, { x: k3[0], duration: 0.18, ease: "power2.inOut" }, 8.40);
      tl.fromTo($("sknob"), { x: 0 }, { x: 210, duration: 0.18, ease: "power2.inOut" }, 8.40);
      tl.fromTo($("sfill"), { scaleX: 0 }, { scaleX: 0.3, duration: 0.18, ease: "power2.inOut" }, 8.40);
      tl.set(zoom, { transformOrigin: res[0] + "px " + res[1] + "px" }, 8.45);

      MK.click(tl, { t: 8.60, x: k3[0], y: k3[1], layer: pfx, shakeEl: shake, rig: zoom, snap: 0.05, rigScale: 1 });

      var land3 = flyChip($("chip3"), 8.60, toDrift(620, 1210, -30, -688, 8.60), -140, 19); // → 8.917
      progress(land3, 66, 100, $("sk3"));
      MK.pop(tl, $("check"), land3, { over: 0.25 });
      // the pop's 18-frame settle would outlive the scene: end it on the cut (9.25)
      var ck = tl.getTweensOf($("check")), ckLast = ck[ck.length - 1];
      ckLast.duration(DUR - ckLast.startTime());
      pval.textContent = "0 %";

      /* ═══ Scene 7 · 8.95–9.25 · EXIT: whip left, last frame = fastest ═══ */
      MK.exit(tl, rig, 8.95, { dir: "left", dist: 1500, frames: 18, blur: bfRig });

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
